<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>World Cup of Flags</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070914;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{display:flex;justify-content:center}.app{width:min(100%,520px);min-height:100vh;padding:16px 14px 24px;background:radial-gradient(circle at 50% 8%,#18234c 0,#0b1024 34%,#070914 72%)}header{text-align:center}.eyebrow{font-size:11px;letter-spacing:3px;color:#8fa5ff;font-weight:800}.title{font-size:34px;font-weight:950;line-height:1;margin:5px 0 4px}.subtitle{color:#9ca7c7;font-size:12px}.round{margin:18px auto 10px;text-align:center;font-weight:900;letter-spacing:1px;font-size:15px}.progress{height:5px;border-radius:99px;background:#202741;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6c7cff,#c46cff);transition:width .35s}.battle{margin-top:15px;display:grid;grid-template-columns:1fr 42px 1fr;gap:8px;align-items:center}.vs{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#161c33;border:1px solid #30395e;font-weight:950;font-size:12px;color:#aab5dc}.card{min-width:0;background:linear-gradient(180deg,#151c35,#0d1226);border:1px solid #293352;border-radius:18px;padding:12px 8px 13px;text-align:center;box-shadow:0 12px 40px #0005}.flag{width:100%;aspect-ratio:1.5;object-fit:cover;border-radius:9px;background:#222b44;box-shadow:0 5px 20px #0008}.country{font-weight:900;font-size:14px;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{font-size:10px;color:#7f8aae;margin-top:3px}.winner{margin:14px 0 0;text-align:center;min-height:28px;color:#aebaff;font-size:13px;font-weight:800}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}.btn{border:0;border-radius:12px;padding:13px;background:#20294a;color:#fff;font-weight:900;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#596bff,#a65dff)}.btn:disabled{opacity:.45;cursor:not-allowed}.bracket{margin-top:18px;background:#0c1123;border:1px solid #202a49;border-radius:16px;padding:12px}.bracket h2{font-size:12px;margin:0 0 9px;color:#9ba8ce;letter-spacing:1px}.rounds{display:flex;gap:6px;overflow:auto;padding-bottom:2px}.pill{flex:0 0 auto;padding:7px 9px;border-radius:9px;background:#171e36;color:#7885aa;font-size:10px;font-weight:800}.pill.active{background:#293566;color:#fff}.history{margin-top:12px;max-height:150px;overflow:auto;font-size:11px;color:#8792b2}.history div{padding:6px 0;border-bottom:1px solid #151d34}.champion{display:none;text-align:center;margin-top:15px;padding:18px;border-radius:18px;background:linear-gradient(180deg,#2a2452,#11152b);border:1px solid #7254bd}.champion.show{display:block}.cup{font-size:42px}.champion strong{display:block;font-size:22px;margin-top:5px}.settings{margin-top:12px;color:#7d89aa;font-size:10px;text-align:center}input[type=range]{width:100%;accent-color:#7a75ff}
</style></head>
<body><main class="app"><header><div class="eyebrow">GLOBAL FLAG TOURNAMENT</div><div class="title">WORLD CUP OF FLAGS</div><div class="subtitle">One flag enters. One flag survives.</div></header><div class="round" id="round">ROUND OF 64</div><div class="progress"><i id="bar"></i></div><section class="battle"><article class="card"><img id="flagA" class="flag"><div id="nameA" class="country">—</div><div id="scoreA" class="score"></div></article><div class="vs">VS</div><article class="card"><img id="flagB" class="flag"><div id="nameB" class="country">—</div><div id="scoreB" class="score"></div></article></section><div id="winner" class="winner">Ready for battle</div><div class="controls"><button class="btn primary" id="fight">⚔️ FIGHT</button><button class="btn" id="auto">▶ AUTO</button><button class="btn" id="reset">↻ NEW CUP</button><button class="btn" id="speed">Speed: 1.5s</button></div><div class="settings">Battle duration <input id="range" type="range" min="500" max="4000" step="250" value="1500"></div><section class="bracket"><h2>TOURNAMENT PROGRESS</h2><div class="rounds" id="rounds"></div><div class="history" id="history"></div></section><section class="champion" id="champion"><div class="cup">🏆</div><strong id="championName"></strong><div>WORLD CUP OF FLAGS CHAMPION</div></section></main>
<script>
const nations=[['Afghanistan','af'],['Albania','al'],['Algeria','dz'],['Andorra','ad'],['Angola','ao'],['Argentina','ar'],['Armenia','am'],['Australia','au'],['Austria','at'],['Azerbaijan','az'],['Bahamas','bs'],['Bahrain','bh'],['Bangladesh','bd'],['Barbados','bb'],['Belarus','by'],['Belgium','be'],['Belize','bz'],['Benin','bj'],['Bhutan','bt'],['Bolivia','bo'],['Bosnia and Herzegovina','ba'],['Botswana','bw'],['Brazil','br'],['Brunei','bn'],['Bulgaria','bg'],['Burkina Faso','bf'],['Burundi','bi'],['Cambodia','kh'],['Cameroon','cm'],['Canada','ca'],['Chad','td'],['Chile','cl'],['China','cn'],['Colombia','co'],['Comoros','km'],['Costa Rica','cr'],['Croatia','hr'],['Cuba','cu'],['Cyprus','cy'],['Czechia','cz'],['Denmark','dk'],['Djibouti','dj'],['Dominica','dm'],['Ecuador','ec'],['Egypt','eg'],['El Salvador','sv'],['Estonia','ee'],['Ethiopia','et'],['Fiji','fj'],['Finland','fi'],['France','fr'],['Gabon','ga'],['Georgia','ge'],['Germany','de'],['Ghana','gh'],['Greece','gr'],['Guatemala','gt'],['Haiti','ht'],['Honduras','hn'],['Hungary','hu'],['Iceland','is'],['India','in'],['Indonesia','id'],['Iran','ir'],['Iraq','iq'],['Ireland','ie'],['Israel','il'],['Italy','it'],['Jamaica','jm'],['Japan','jp'],['Jordan','jo'],['Kazakhstan','kz'],['Kenya','ke'],['Kuwait','kw'],['Kyrgyzstan','kg'],['Laos','la'],['Latvia','lv'],['Lebanon','lb'],['Lesotho','ls'],['Liberia','lr'],['Libya','ly'],['Lithuania','lt'],['Luxembourg','lu'],['Madagascar','mg'],['Malawi','mw'],['Malaysia','my'],['Maldives','mv'],['Mali','ml'],['Malta','mt'],['Mauritania','mr'],['Mauritius','mu'],['Mexico','mx'],['Moldova','md'],['Monaco','mc'],['Mongolia','mn'],['Montenegro','me'],['Morocco','ma'],['Mozambique','mz'],['Myanmar','mm'],['Namibia','na'],['Nepal','np'],['Netherlands','nl'],['New Zealand','nz'],['Nicaragua','ni'],['Niger','ne'],['Nigeria','ng'],['North Korea','kp'],['North Macedonia','mk'],['Norway','no'],['Oman','om'],['Pakistan','pk'],['Panama','pa'],['Papua New Guinea','pg'],['Paraguay','py'],['Peru','pe'],['Philippines','ph'],['Poland','pl'],['Portugal','pt'],['Qatar','qa'],['Romania','ro'],['Russia','ru'],['Rwanda','rw'],['Saudi Arabia','sa'],['Senegal','sn'],['Serbia','rs'],['Singapore','sg'],['Slovakia','sk'],['Slovenia','si'],['Somalia','so'],['South Africa','za'],['South Korea','kr'],['Spain','es'],['Sri Lanka','lk'],['Sudan','sd'],['Suriname','sr'],['Sweden','se'],['Switzerland','ch'],['Syria','sy'],['Taiwan','tw'],['Tajikistan','tj'],['Tanzania','tz'],['Thailand','th'],['Togo','tg'],['Tonga','to'],['Tunisia','tn'],['Turkey','tr'],['Turkmenistan','tm'],['Uganda','ug'],['Ukraine','ua'],['United Arab Emirates','ae'],['United Kingdom','gb'],['United States','us'],['Uruguay','uy'],['Uzbekistan','uz'],['Venezuela','ve'],['Vietnam','vn'],['Yemen','ye'],['Zambia','zm'],['Zimbabwe','zw']];
const FLAG=c=>`https://flagcdn.com/w640/${c}.png`;const sizes=[64,32,16,8,4,2,1], labels=['ROUND OF 64','ROUND OF 32','ROUND OF 16','QUARTERFINALS','SEMIFINALS','GRAND FINAL','CHAMPION'];let pool=[],round=0,a=null,b=null,autoTimer=null,duration=1500;
const $=id=>document.getElementById(id);function shuffle(x){return [...x].sort(()=>Math.random()-.5)}function weighted(a,b){let wa=.65+Math.random()*.7,wb=.65+Math.random()*.7;return Math.random() < wa/(wa+wb)?a:b}
function roundsUI(){ $('rounds').innerHTML=labels.map((x,i)=>`<span class="pill ${i===round?'active':''}">${x}</span>`).join('') }
function start(){clearInterval(autoTimer);pool=shuffle(nations).slice(0,64);round=0;$('champion').classList.remove('show');$('history').innerHTML='';nextBattle();}
function nextBattle(){if(pool.length<=1){finish();return}if(pool.length%2){pool.push(nations.find(n=>!pool.some(p=>p[1]===n[1]))||nations[0])}a=pool.shift();b=pool.shift();render();roundsUI()}
function render(){ $('round').textContent=labels[round]||'TOURNAMENT';$('flagA').src=FLAG(a[1]);$('flagB').src=FLAG(b[1]);$('nameA').textContent=a[0];$('nameB').textContent=b[0];$('scoreA').textContent='CHALLENGER';$('scoreB').textContent='CHALLENGER';$('winner').textContent='Ready for battle';$('bar').style.width=`${Math.min(100,(1-(pool.length/64))*100)}%` }
function fight(){if(!a||!b)return;let winner=weighted(a,b);let loser=winner===a?b:a;pool.push(winner);$('winner').textContent=`🏆 ${winner[0]} advances!`;$('scoreA').textContent=winner===a?'WINNER':'ELIMINATED';$('scoreB').textContent=winner===b?'WINNER':'ELIMINATED';$('history').innerHTML=`<div>⚔️ ${winner[0]} defeated ${loser[0]}</div>`+$('history').innerHTML;a=b=null;setTimeout(()=>{if(pool.length===1)finish();else{if(pool.length<=32)round=Math.min(1,round+1);else if(pool.length<=16)round=2;else if(pool.length<=8)round=3;else if(pool.length<=4)round=4;else if(pool.length<=2)round=5;nextBattle()}},duration*.55)}
function finish(){let c=pool[0];if(!c)return;$('round').textContent='CHAMPION';$('winner').textContent='THE TOURNAMENT IS OVER';$('championName').textContent=c[0];$('champion').classList.add('show');$('bar').style.width='100%';round=6;roundsUI();clearInterval(autoTimer)}
$('fight').onclick=fight;$('reset').onclick=start;$('auto').onclick=()=>{if(autoTimer){clearInterval(autoTimer);autoTimer=null;$('auto').textContent='▶ AUTO'}else{$('auto').textContent='⏸ PAUSE';autoTimer=setInterval(()=>{if(a&&b)fight()},duration*.8);if(a&&b)fight()}};$('range').oninput=e=>duration=+e.target.value;$('speed').onclick=()=>{$('speed').textContent=`Speed: ${(duration/1000).toFixed(2)}s`};start();
</script></body></html>
