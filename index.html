<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>World Cup of Flags</title><style>*{box-sizing:border-box}html,body{margin:0;background:#02060a;color:#fff;font-family:system-ui,sans-serif}body{display:flex;justify-content:center}.app{width:min(100%,560px);min-height:100vh;padding:8px;background:radial-gradient(circle at 50% 0,#18365a,#07111a 38%,#02060a 80%)}.top{display:flex;justify-content:space-between;align-items:center}.live{font-size:8px;font-weight:900;letter-spacing:1.5px;color:#ff6b80}.live i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#f45;margin-right:5px}.btn{border:1px solid #29415d;background:#0d1a2a;color:#fff;border-radius:9px;padding:8px 10px;font-size:8px;font-weight:900}.primary{background:linear-gradient(135deg,#386cff,#a148ff);border:0}.title{text-align:center;font-size:25px;font-weight:1000;line-height:.88;margin:6px 0 3px}.sub{text-align:center;color:#8798b5;font-size:8px;margin-bottom:7px}.panel{background:#0b1726;border:1px solid #203651;border-radius:10px;padding:7px;margin-top:6px}.row{display:flex;justify-content:space-between;font-size:8px;font-weight:900}.bar{height:4px;background:#192a40;border-radius:9px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#35d7ff,#8c5cff)}.arenaBox{position:relative;margin-top:7px;border:2px solid #38506a;border-radius:13px;overflow:hidden;background:#087532;box-shadow:0 15px 40px #0009}.arena{display:block;width:100%;height:auto;aspect-ratio:9/13}.badge{position:absolute;top:7px;left:50%;transform:translateX(-50%);padding:5px 8px;border-radius:99px;background:#06100acc;border:1px solid #ffffff33;font-size:7px;font-weight:900;white-space:nowrap}.scorebar{position:absolute;left:7px;right:7px;bottom:7px;display:flex;gap:6px}.score{flex:1;background:#06100acc;border:1px solid #ffffff33;border-radius:8px;padding:5px;text-align:center;font-size:7px;font-weight:900}.announce{text-align:center;min-height:27px;padding:6px 2px;font-size:9px;font-weight:900}.announce strong{color:#6ee8ff}.controls{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:5px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:5px}.setting{background:#0b1726;border:1px solid #203651;border-radius:9px;padding:6px}.setting label{display:flex;justify-content:space-between;color:#899ab7;font-size:7px}.setting input{width:100%;accent-color:#647cff}.rounds{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:5px}.round{padding:5px 1px;background:#122139;border-radius:6px;text-align:center;color:#687c9b;font-size:6px;font-weight:900}.round.active{background:#304a7c;color:#fff}.feed{max-height:90px;overflow:auto}.event{padding:4px 0;border-bottom:1px solid #17263b;color:#8797b2;font-size:7px}.champ{display:none;text-align:center;margin-top:7px;padding:15px;background:#382b14;border:1px solid #b38c3d;border-radius:13px}.champ.show{display:block}.champ h2{margin:3px;font-size:21px}.cup{font-size:38px}@keyframes goal{50%{filter:brightness(2)}}.goal{animation:goal .25s 8}</style></head><body><main class="app"><div class="top"><div class="live"><i></i>LIVE AUTOMATED CUP</div><button class="btn" id="fs">⛶</button></div><div class="title">WORLD CUP<br>OF FLAGS</div><div class="sub">Autonomous football • Goal = elimination</div><section class="panel"><div class="row"><span id="round">ROUND OF 64</span><span id="match">32 MATCHES</span></div><div class="bar"><i id="progress"></i></div></section><div class="arenaBox" id="box"><canvas id="arena" class="arena"></canvas><div class="badge">🤖 AUTONOMOUS PHYSICS</div><div class="scorebar"><div class="score" id="topName">—</div><div class="score" id="bottomName">—</div></div></div><div class="announce" id="announce">Ready</div><div class="controls"><button class="btn primary" id="kick">⚽ KICKOFF</button><button class="btn" id="auto">▶ AUTO</button><button class="btn" id="new">↻ NEW CUP</button></div><div class="settings"><div class="setting"><label>SPEED <b id="speedV">1.0×</b></label><input id="speed" type="range" min=".5" max="2" step=".1" value="1"></div><div class="setting"><label>CHAOS <b id="chaosV">50%</b></label><input id="chaos" type="range" min="0" max="100" value="50"></div></div><section class="panel"><div class="row"><span>TOURNAMENT</span><span id="teams">64 TEAMS</span></div><div class="rounds" id="rounds"></div></section><section class="panel"><div class="row"><span>COMMENTARY</span><span>LIVE</span></div><div class="feed" id="feed"></div></section><section class="champ" id="champ"><div class="cup">🏆</div><h2 id="champion">—</h2><div>WORLD CUP OF FLAGS CHAMPION</div><button class="btn primary" id="again">PLAY AGAIN</button></section></main><script>
const N=[['Argentina','ar'],['Australia','au'],['Austria','at'],['Belgium','be'],['Brazil','br'],['Bulgaria','bg'],['Cameroon','cm'],['Canada','ca'],['Chile','cl'],['China','cn'],['Colombia','co'],['Croatia','hr'],['Czechia','cz'],['Denmark','dk'],['Ecuador','ec'],['Egypt','eg'],['England','gb'],['Finland','fi'],['France','fr'],['Germany','de'],['Ghana','gh'],['Greece','gr'],['Hungary','hu'],['Iceland','is'],['India','in'],['Indonesia','id'],['Iran','ir'],['Ireland','ie'],['Italy','it'],['Jamaica','jm'],['Japan','jp'],['Kenya','ke'],['Mexico','mx'],['Morocco','ma'],['Netherlands','nl'],['New Zealand','nz'],['Nigeria','ng'],['Norway','no'],['Panama','pa'],['Paraguay','py'],['Peru','pe'],['Poland','pl'],['Portugal','pt'],['Qatar','qa'],['Romania','ro'],['Russia','ru'],['Saudi Arabia','sa'],['Senegal','sn'],['Serbia','rs'],['Singapore','sg'],['Slovakia','sk'],['Slovenia','si'],['South Africa','za'],['South Korea','kr'],['Spain','es'],['Sweden','se'],['Switzerland','ch'],['Tunisia','tn'],['Turkey','tr'],['Ukraine','ua'],['United States','us'],['Uruguay','uy'],['Vietnam','vn']];const R=['R64','R32','R16','QF','SF','FINAL'],$=id=>document.getElementById(id),cv=$('arena'),ctx=cv.getContext('2d'),W=540,H=780,GOAL=190,M=35;let queue=[],winners=[],left,right,ps=[],ball,playing=false,auto=false,round=0,speed=1,chaos=50,last=0,acc=0,events=[],images={},goalLock=false,matchTime=0;
function resize(){let d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function shuffle(a){return[...a].sort(()=>Math.random()-.5)}function log(s){events.unshift(s);$('feed').innerHTML=events.slice(0,24).map(x=>`<div class=event>${x}</div>`).join('')}function flag(t){if(!images[t[1]]){let i=new Image();i.src='https://flagcdn.com/w160/'+t[1]+'.png';images[t[1]]=i}return images[t[1]]}function update(){let n=queue.length+winners.length+(left&&right?2:0);$('round').textContent=R[Math.min(round,5)];$('match').textContent=n>1?Math.ceil(n/2)+' MATCHES':'COMPLETE';$('teams').textContent=n+' '+(n===1?'TEAM':'TEAMS');$('progress').style.width=Math.max(0,Math.min(100,(64-n)/63*100))+'%';$('rounds').innerHTML=R.map((x,i)=>`<div class="round ${i===round?'active':''}">${x}</div>`).join('');if(left&&right){$('topName').textContent='⬇ '+right[0];$('bottomName').textContent='⬆ '+left[0]}}
function player(t,team){return{t,team,x:W/2,y:team?H*.78:H*.22,vx:0,vy:0,r:24,skill:.9+Math.random()*.25,shot:0,steal:0,dribble:0}}function setup(){if(queue.length<2){if(winners.length===1){champ(winners[0]);return}if(winners.length){queue=winners;winners=[];round++}else return}left=queue.shift();right=queue.shift();ps=[player(right,0),player(left,1)];ball={x:W/2,y:H/2,vx:0,vy:0,r:8,owner:-1};matchTime=0;goalLock=false;update();$('announce').innerHTML=`⚽ <strong>${right[0]}</strong> vs <strong>${left[0]}</strong> — READY`;$('kick').textContent='⚽ KICKOFF'}
function kickoff(){if(!left)return;playing=true;$('kick').textContent='⏸ PAUSE';$('announce').innerHTML=`⚡ KICKOFF — <strong>${right[0]}</strong> attacks DOWN, <strong>${left[0]}</strong> attacks UP`;log(`⚽ ${right[0]} vs ${left[0]} — kickoff`);ball.vy=(Math.random()<.5?1:-1)*1.8}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function norm(x,y){let d=Math.hypot(x,y)||1;return[x/d,y/d]}
function physics(){if(!playing)return;const A=ps[0],B=ps[1];matchTime+=1/60;for(const p of ps){let targetX=ball.x,targetY=ball.y;if(ball.owner===p.team){targetX=W/2+(ball.x-W/2)*.25;targetY=p.team?ball.y-80:ball.y+80;let goalY=p.team?0:H;targetX=W/2+(W/2-targetX)*.15;targetY=goalY}else{let d=Math.hypot(ball.x-p.x,ball.y-p.y);if(d<230){targetX=ball.x;targetY=ball.y}else{targetX=W/2;targetY=p.team?H*.62:H*.38}}let[nx,ny]=norm(targetX-p.x,targetY-p.y);let accel=.12*p.skill*(.9+chaos/180);p.vx+=nx*accel;p.vy+=ny*accel;p.vx*=.94;p.vy*=.94;let max=3.8*(ball.owner===p.team?1.12:1);let v=Math.hypot(p.vx,p.vy);if(v>max){p.vx=p.vx/v*max;p.vy=p.vy/v*max}p.x=clamp(p.x+p.vx,M,W-M);p.y=clamp(p.y+p.vy,M,H-M)}let dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1,min=A.r+B.r;if(d<min){let nx=dx/d,ny=dy/d,over=min-d;A.x-=nx*over*.55;A.y-=ny*over*.55;B.x+=nx*over*.55;B.y+=ny*over*.55;let rel=(B.vx-A.vx)*nx+(B.vy-A.vy)*ny;if(rel<0){let j=-rel*.9;A.vx-=nx*j;A.vy-=ny*j;B.vx+=nx*j;B.vy+=ny*j}if(ball.owner>=0){let losing=ball.owner;let challenger=1-losing;if(Math.random()<.55){ball.owner=challenger;ps[challenger].steal=8;$('announce').innerHTML=`💥 <strong>${ps[challenger].t[0]}</strong> wins the tackle!`;log(`💥 ${ps[challenger].t[0]} steals possession`)}}}
if(ball.owner<0){for(let i=0;i<2;i++){let p=ps[i],bd=Math.hypot(ball.x-p.x,ball.y-p.y);if(bd<p.r+ball.r+9){ball.owner=i;ball.vx=ball.vy=0;$('announce').innerHTML=`⚡ <strong>${p.t[0]}</strong> controls the ball`;break}}}else{let p=ps[ball.owner],goalY=p.team?0:H,dir=p.team?-1:1;ball.x=p.x;ball.y=p.y+dir*27;ball.vx=p.vx;ball.vy=p.vy;p.shot-=1/60;p.steal=Math.max(0,p.steal-1);let near=Math.abs(goalY-p.y)<210;if(near&&p.shot<=0){let chance=.018*(1+chaos/100)*p.skill;if(Math.random()<chance){ball.owner=-1;let tx=W/2+(Math.random()-.5)*GOAL*.72-p.x,ty=goalY-p.y,dd=Math.hypot(tx,ty)||1,spd=9+Math.random()*3.5;ball.vx=tx/dd*spd;ball.vy=ty/dd*spd;p.shot=1.2;$('announce').innerHTML=`🔥 <strong>${p.t[0]}</strong> SHOOTS!`;log(`🎯 ${p.t[0]} fires at goal`)}}}
if(ball.owner<0){ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.992;ball.vy*=.992;if(ball.x<M){ball.x=M;ball.vx=Math.abs(ball.vx)*.85}if(ball.x>W-M){ball.x=W-M;ball.vx=-Math.abs(ball.vx)*.85}}let inGoal=ball.x>W/2-GOAL/2&&ball.x<W/2+GOAL/2;if(ball.y<0&&inGoal)score(B);else if(ball.y>H&&inGoal)score(A);else{if(ball.y<12){ball.y=12;ball.vy=Math.abs(ball.vy)*.82}if(ball.y>H-12){ball.y=H-12;ball.vy=-Math.abs(ball.vy)*.82}}if(matchTime>45&&!goalLock){let w=Math.random()<.5?A:B;score(w)}}
function score(w){if(!playing||goalLock)return;goalLock=true;playing=false;let loser=w===A?B:A;winners.push(w.t);$('box').classList.add('goal');$('announce').innerHTML=`⚽ <strong>${w.t[0]}</strong> SCORES! — ${loser.t[0]} ELIMINATED`;log(`🥅 GOAL — ${w.t[0]} defeats ${loser.t[0]}`);$('kick').textContent='⚽ NEXT';setTimeout(()=>{$('box').classList.remove('goal');left=right=null;goalLock=false;setup()},900/speed)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#08752f';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffffbb';ctx.lineWidth=3;ctx.strokeRect(18,18,W-36,H-36);ctx.beginPath();ctx.moveTo(18,H/2);ctx.lineTo(W-18,H/2);ctx.stroke();ctx.beginPath();ctx.arc(W/2,H/2,63,0,Math.PI*2);ctx.stroke();ctx.strokeRect(W/2-GOAL/2,18,GOAL,65);ctx.strokeRect(W/2-GOAL/2,H-83,GOAL,65);ctx.strokeRect(W/2-75,18,150,180);ctx.strokeRect(W/2-75,H-198,150,180);ctx.beginPath();ctx.arc(W/2,198,55,0,Math.PI);ctx.stroke();ctx.beginPath();ctx.arc(W/2,H-198,55,Math.PI,Math.PI*2);ctx.stroke();for(const p of ps){ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(0,27,23,7,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(0,0,27,0,Math.PI*2);ctx.clip();let im=flag(p.t);if(im.complete&&im.naturalWidth)ctx.drawImage(im,-27,-27,54,54);else{ctx.fillStyle='#fff';ctx.fillRect(-27,-27,54,54)}ctx.restore();ctx.strokeStyle=p.team?'#5fe7ff':'#ffd65a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,30,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.font='900 9px system-ui';ctx.textAlign='center';ctx.fillText(p.t[0],p.x,p.y+43)}if(ball){ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#111';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText('⚽',ball.x,ball.y+4)}}function loop(t){if(!last)last=t;let dt=Math.min(.05,(t-last)/1000)*speed;last=t;acc+=dt;while(acc>=1/60){physics();acc-=1/60}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);function champ(c){playing=false;left=right=null;$('round').textContent='CHAMPION';$('match').textContent='COMPLETE';$('teams').textContent='1 CHAMPION';$('progress').style.width='100%';$('champion').textContent=c[0];$('champ').classList.add('show');$('announce').innerHTML=`🏆 <strong>${c[0]}</strong> IS CHAMPION!`;log(`👑 ${c[0]} won the tournament`)}function newCup(){playing=false;round=0;queue=shuffle(N).slice(0,64);winners=[];left=right=null;events=[];$('feed').innerHTML='';$('champ').classList.remove('show');setup()}$('kick').onclick=()=>playing?(playing=false,$('kick').textContent='⚽ RESUME'):kickoff();$('new').onclick=newCup;$('again').onclick=newCup;$('auto').onclick=()=>{auto=!auto;$('auto').textContent=auto?'⏸ AUTO':'▶ AUTO';if(auto&&!playing)kickoff()};$('speed').oninput=e=>{speed=+e.target.value;$('speedV').textContent=speed.toFixed(1)+'×'};$('chaos').oninput=e=>{chaos=+e.target.value;$('chaosV').textContent=chaos+'%'};$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();newCup();</script></body></html>
