<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>World Cup of Flags — Football Physics</title><style>*{box-sizing:border-box}body{margin:0;background:#03070d;color:#fff;font-family:system-ui,sans-serif;display:flex;justify-content:center}.app{width:min(100%,560px);min-height:100vh;padding:12px;background:radial-gradient(circle at 50% 0,#17345b,#07111f 35%,#03070d 75%)}header{text-align:center}.live{font-size:9px;font-weight:900;letter-spacing:2px;color:#ff6d7f}.title{font-size:29px;font-weight:1000;line-height:.95;margin:5px}.sub{font-size:10px;color:#8998b7;margin:7px 0}.modes{display:flex;gap:6px;margin:9px 0}.mode,.btn{border:1px solid #263a5d;background:#101b2d;color:#dbe5f8;border-radius:10px;padding:9px 10px;font-size:9px;font-weight:900}.mode.active,.btn.primary{background:linear-gradient(135deg,#346cff,#9d43ff);border-color:transparent}.status,.section{background:#0b1627;border:1px solid #203452;border-radius:13px;padding:9px;margin-top:8px}.row,.head{display:flex;justify-content:space-between;font-size:9px;font-weight:900}.bar{height:5px;background:#182842;border-radius:99px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#38d6ff,#8f55ff)}.arenaWrap{margin-top:9px;border:2px solid #25415b;border-radius:17px;overflow:hidden;background:#075d2a}.arena{display:block;width:100%;aspect-ratio:9/12}.announce{text-align:center;min-height:32px;padding:8px;font-size:11px;font-weight:950}.controls{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.setting{background:#101b2d;border:1px solid #1e304b;border-radius:10px;padding:7px}.setting label{display:flex;justify-content:space-between;font-size:8px;color:#8fa0bf}.setting input{width:100%;accent-color:#587dff}.rounds{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:7px}.r{padding:6px 2px;text-align:center;background:#111f33;border-radius:7px;font-size:7px;color:#667996;font-weight:900}.r.active{background:#293f70;color:#fff}.feed{max-height:120px;overflow:auto}.event{padding:5px 0;border-bottom:1px solid #15243a;font-size:8px;color:#8393b1}.champ{display:none;text-align:center;padding:18px;background:radial-gradient(circle at 50% 0,#5b4718,#1b1820 55%,#0b1019);border:1px solid #a58236;border-radius:16px;margin-top:8px}.champ.show{display:block}.cup{font-size:46px}.champ h2{margin:4px 0}.footer{text-align:center;font-size:7px;color:#4f607d;margin-top:10px}@keyframes goal{50%{filter:brightness(1.8) saturate(1.5)}}.goal{animation:goal .6s 3}</style></head><body><main class="app"><header><div class="live">● LIVE AUTOMATED TOURNAMENT</div><div class="title">WORLD CUP<br>OF FLAGS</div><div class="sub">Automated football physics decides who survives.</div></header><div class="modes"><button class="mode active" data-mode="balanced">🏆 BALANCED</button><button class="mode" data-mode="chaos">🔥 CHAOS</button></div><section class="status"><div class="row"><span id="round">ROUND OF 64</span><span id="count">32 MATCHES</span></div><div class="bar"><i id="progress"></i></div></section><div class="arenaWrap" id="wrap"><canvas id="arena"></canvas></div><div class="announce" id="announce">Kickoff loading…</div><div class="controls"><button class="btn primary" id="start">⚽ KICKOFF</button><button class="btn" id="auto">▶ AUTO CUP</button><button class="btn" id="new">↻ NEW CUP</button></div><div class="settings"><div class="setting"><label>Match speed <b id="speedv">1.0×</b></label><input id="speed" type="range" min=".5" max="2" step=".1" value="1"></div><div class="setting"><label>Physics chaos <b id="chaosv">55%</b></label><input id="chaos" type="range" min="0" max="100" value="55"></div></div><section class="section"><div class="head"><span>TOURNAMENT BRACKET</span><span id="remaining">64 TEAMS</span></div><div class="rounds" id="rounds"></div></section><section class="section"><div class="head"><span>LIVE COMMENTARY</span><span>● LIVE</span></div><div class="feed" id="feed"></div></section><section class="champ" id="champ"><div class="cup">🏆</div><h2 id="champName">—</h2><p>WORLD CUP OF FLAGS CHAMPION</p><button class="btn primary" id="again">PLAY ANOTHER CUP</button></section><div class="footer">Automated 2D physics • Flag footballers • Goal = elimination</div></main><script>const N=[['Argentina','ar'],['Australia','au'],['Austria','at'],['Belgium','be'],['Brazil','br'],['Bulgaria','bg'],['Cameroon','cm'],['Canada','ca'],['Chile','cl'],['China','cn'],['Colombia','co'],['Croatia','hr'],['Czechia','cz'],['Denmark','dk'],['Ecuador','ec'],['Egypt','eg'],['England','gb'],['Finland','fi'],['France','fr'],['Germany','de'],['Ghana','gh'],['Greece','gr'],['Hungary','hu'],['Iceland','is'],['India','in'],['Indonesia','id'],['Iran','ir'],['Ireland','ie'],['Italy','it'],['Jamaica','jm'],['Japan','jp'],['Kenya','ke'],['Mexico','mx'],['Morocco','ma'],['Netherlands','nl'],['New Zealand','nz'],['Nigeria','ng'],['Norway','no'],['Panama','pa'],['Paraguay','py'],['Peru','pe'],['Poland','pl'],['Portugal','pt'],['Qatar','qa'],['Romania','ro'],['Russia','ru'],['Saudi Arabia','sa'],['Senegal','sn'],['Serbia','rs'],['Singapore','sg'],['Slovakia','sk'],['Slovenia','si'],['South Africa','za'],['South Korea','kr'],['Spain','es'],['Sweden','se'],['Switzerland','ch'],['Tunisia','tn'],['Turkey','tr'],['Ukraine','ua'],['United States','us'],['Uruguay','uy'],['Vietnam','vn']];const R=['R64','R32','R16','QF','SF','FINAL'], $=id=>document.getElementById(id),img=c=>`https://flagcdn.com/w160/${c}.png`,cv=$('arena'),ctx=cv.getContext('2d');let W=540,H=720,pool=[],a,b,state=[],ball,playing=false,auto=false,speed=1,chaos=55,mode='balanced',winners=[],history=[],timer=0;function fit(){let d=devicePixelRatio||1;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',fit);fit();function sh(x){return[...x].sort(()=>Math.random()-.5)}function log(x){history.unshift(x);$('feed').innerHTML=history.slice(0,25).map(v=>`<div class="event">${v}</div>`).join('')}function update(){let n=pool.length+(a&&b?2:0),r=n>=64?0:n>=32?1:n>=16?2:n>=8?3:n>=4?4:n>=2?5:6;$('round').textContent=r<6?['ROUND OF 64','ROUND OF 32','ROUND OF 16','QUARTERFINALS','SEMIFINALS','GRAND FINAL'][r]:'CHAMPION';$('count').textContent=r<6?`${Math.ceil(n/2)} MATCHES`:'COMPLETE';$('remaining').textContent=`${n} TEAMS`;$('progress').style.width=((64-n)/63*100)+'%';$('rounds').innerHTML=R.map((x,i)=>`<div class="r ${i===r?'active':''}">${x}</div>`).join('')}function kickoff(){let p=(t,x,team)=>({t,x,y:H/2+(Math.random()-.5)*180,vx:0,vy:0,r:26,team,energy:.85+Math.random()*.3});state=[p(a,90,0),p(b,W-90,1)];ball={x:W/2,y:H/2,vx:(Math.random()<.5?-1:1)*3,vy:(Math.random()-.5)*2,r:8,owner:null};playing=true;$('start').textContent='⏸ PLAYING';$('announce').innerHTML=`⚽ <b>${a[0]}</b> vs <b>${b[0]}</b> — KICKOFF!`;log(`⚽ Kickoff: <b>${a[0]}</b> vs <b>${b[0]}</b>`)}function step(dt){if(!playing)return;for(const p of state){let gx=p.team?W-40:40,dx=gx-p.x,dy=H/2-p.y,d=Math.hypot(dx,dy)||1;if(ball.owner!==p.team){dx=ball.x-p.x;dy=ball.y-p.y;d=Math.hypot(dx,dy)||1}p.vx+=(dx/d)*.055*p.energy*(.7+chaos/180);p.vy+=(dy/d)*.055*p.energy*(.7+chaos/180);let m=2.4*p.energy;if(ball.owner===p.team)m*=1.15;p.vx*=.96;p.vy*=.96;let v=Math.hypot(p.vx,p.vy);if(v>m){p.vx=p.vx/v*m;p.vy=p.vy/v*m}p.x=Math.max(32,Math.min(W-32,p.x+p.vx*dt));p.y=Math.max(32,Math.min(H-32,p.y+p.vy*dt))}let p0=state[0],p1=state[1],d=Math.hypot(p1.x-p0.x,p1.y-p0.y)||1;if(d<p0.r+p1.r){p0.vx*=-.7;p1.vx*=-.7;if(ball.owner!==null&&Math.random()<.3+chaos/250)ball.owner=1-ball.owner}if(ball.owner!==null){let p=state[ball.owner];ball.x=p.x+(p.team?25:-25);ball.y=p.y;ball.vx=p.vx;ball.vy=p.vy;if(Math.abs((p.team?W:0)-ball.x)<115&&Math.random()<.012*(1+chaos/80)*dt){ball.owner=null;ball.vx=(p.team?1:-1)*(6+Math.random()*3);ball.vy=(Math.random()-.5)*4;$('announce').innerHTML=`🔥 <b>${p.t[0]}</b> SHOOTS!`}}else{ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=.992;ball.vy*=.992;for(const p of state){let d=Math.hypot(ball.x-p.x,ball.y-p.y);if(d<p.r+ball.r+5){if(Math.random()<.72){ball.owner=p.team;ball.vx=ball.vy=0;$('announce').innerHTML=`⚡ <b>${p.t[0]}</b> wins possession`}}}}if(ball.y<20||ball.y>H-20){ball.vy*=-.9;ball.y=Math.max(20,Math.min(H-20,ball.y))}if(ball.x<0||ball.x>W)goal(ball.x>W?a:b)}function goal(w){if(!playing)return;playing=false;let l=w===a?b:a;$('wrap').classList.add('goal');setTimeout(()=>$('wrap').classList.remove('goal'),1500);$('announce').innerHTML=`⚽ <b>${w[0]}</b> SCORES! — ${l[0]} ELIMINATED`;log(`🥅 GOAL! <b>${w[0]}</b> defeated <b>${l[0]}</b>`);winners.push(w);setTimeout(next,Math.max(650,900/speed))}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#087334';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff88';ctx.lineWidth=3;ctx.strokeRect(15,15,W-30,H-30);ctx.beginPath();ctx.moveTo(W/2,15);ctx.lineTo(W/2,H-15);ctx.stroke();ctx.beginPath();ctx.arc(W/2,H/2,62,0,Math.PI*2);ctx.stroke();ctx.strokeRect(15,H/2-105,48,210);ctx.strokeRect(W-63,H/2-105,48,210);ctx.fillStyle='#fff';ctx.fillRect(0,H/2-70,12,140);ctx.fillRect(W-12,H/2-70,12,140);for(const p of state){ctx.save();ctx.translate(p.x,p.y);ctx.beginPath();ctx.arc(0,0,28,0,Math.PI*2);ctx.clip();let im=new Image();im.src=img(p.t[1]);ctx.drawImage(im,-28,-28,56,56);ctx.restore();ctx.strokeStyle=p.team?'#ffd95a':'#60e7ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,30,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.font='900 9px system-ui';ctx.textAlign='center';ctx.fillText(p.t[0],p.x,p.y+43)}if(ball){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('⚽',ball.x,ball.y+4)}}function loop(t){if(!timer)timer=t;let dt=Math.min(2,(t-timer)/16.67)*speed;timer=t;if(playing)step(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);function next(){if(winners.length===1&&pool.length===0){champion(winners[0]);return}if(!a&&!b){if(pool.length<2){pool=[...winners];winners=[]}a=pool.shift();b=pool.shift()}update();kickoff()}function champion(c){$('round').textContent='CHAMPION';$('count').textContent='COMPLETE';$('remaining').textContent='1 CHAMPION';$('progress').style.width='100%';$('champName').textContent=c[0];$('champ').classList.add('show');$('announce').innerHTML=`🏆 <b>${c[0]}</b> is WORLD CUP OF FLAGS CHAMPION!`;log(`👑 <b>${c[0]}</b> won the tournament`)}function newCup(){playing=false;pool=sh(N).slice(0,64);winners=[];a=b=null;history=[];$('feed').innerHTML='';$('champ').classList.remove('show');update();next()}$('start').onclick=()=>{if(playing){playing=false;$('start').textContent='⚽ RESUME'}else if(a&&b)kickoff();else next()};$('new').onclick=newCup;$('again').onclick=newCup;$('auto').onclick=()=>{auto=!auto;$('auto').textContent=auto?'⏸ AUTO CUP':'▶ AUTO CUP';if(auto&&!playing)kickoff()};$('speed').oninput=e=>{speed=+e.target.value;$('speedv').textContent=speed.toFixed(1)+'×'};$('chaos').oninput=e=>{chaos=+e.target.value;$('chaosv').textContent=chaos+'%'};document.querySelectorAll('.mode').forEach(x=>x.onclick=()=>{document.querySelectorAll('.mode').forEach(y=>y.classList.remove('active'));x.classList.add('active');mode=x.dataset.mode;newCup()});newCup();</script></body></html>
