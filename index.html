<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>World Cup of Flags</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#02060a;color:#fff;font-family:system-ui,sans-serif}body{display:flex;justify-content:center}.app{width:min(100%,560px);min-height:100vh;padding:8px;background:radial-gradient(circle at 50% 0,#18365a,#07111a 38%,#02060a 80%)}.top{display:flex;justify-content:space-between;align-items:center}.live{font-size:8px;font-weight:900;letter-spacing:1.5px;color:#ff6b80}.live i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#f45;margin-right:5px}.btn{border:1px solid #29415d;background:#0d1a2a;color:#fff;border-radius:9px;padding:8px 10px;font-size:8px;font-weight:900}.primary{background:linear-gradient(135deg,#386cff,#a148ff);border:0}.title{text-align:center;font-size:25px;font-weight:1000;line-height:.88;margin:6px 0 3px}.sub{text-align:center;color:#8798b5;font-size:8px;margin-bottom:7px}.panel{background:#0b1726;border:1px solid #203651;border-radius:10px;padding:7px;margin-top:6px}.row{display:flex;justify-content:space-between;font-size:8px;font-weight:900}.bar{height:4px;background:#192a40;border-radius:9px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#35d7ff,#8c5cff)}.arenaBox{position:relative;margin-top:7px;border:2px solid #38506a;border-radius:13px;overflow:hidden;background:#087532;box-shadow:0 15px 40px #0009}.arena{display:block;width:100%;height:auto;aspect-ratio:9/13}.badge{position:absolute;top:7px;left:50%;transform:translateX(-50%);padding:5px 8px;border-radius:99px;background:#06100acc;border:1px solid #ffffff33;font-size:7px;font-weight:900;white-space:nowrap}.scorebar{position:absolute;left:7px;right:7px;bottom:7px;display:flex;gap:6px}.score{flex:1;background:#06100acc;border:1px solid #ffffff33;border-radius:8px;padding:5px;text-align:center;font-size:7px;font-weight:900}.announce{text-align:center;min-height:27px;padding:6px 2px;font-size:9px;font-weight:900}.announce strong{color:#6ee8ff}.controls{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:5px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:5px}.setting{background:#0b1726;border:1px solid #203651;border-radius:9px;padding:6px}.setting label{display:flex;justify-content:space-between;color:#899ab7;font-size:7px}.setting input{width:100%;accent-color:#647cff}.rounds{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:5px}.round{padding:5px 1px;background:#122139;border-radius:6px;text-align:center;color:#687c9b;font-size:6px;font-weight:900}.round.active{background:#304a7c;color:#fff}.feed{max-height:90px;overflow:auto}.event{padding:4px 0;border-bottom:1px solid #17263b;color:#8797b2;font-size:7px}.champ{display:none;text-align:center;margin-top:7px;padding:15px;background:#382b14;border:1px solid #b38c3d;border-radius:13px}.champ.show{display:block}.champ h2{margin:3px;font-size:21px}.cup{font-size:38px}@keyframes goal{50%{filter:brightness(2)}}.goal{animation:goal .25s 8}
</style>
</head>
<body><main class="app">
<div class="top"><div class="live"><i></i>LIVE AUTOMATED CUP</div><button class="btn" id="fs">⛶</button></div>
<div class="title">WORLD CUP<br>OF FLAGS</div><div class="sub">Autonomous football • Goal = elimination</div>
<section class="panel"><div class="row"><span id="round">ROUND OF 64</span><span id="match">32 MATCHES</span></div><div class="bar"><i id="progress"></i></div></section>
<div class="arenaBox" id="box"><canvas id="arena" class="arena"></canvas><div class="badge">🤖 AUTONOMOUS PHYSICS</div><div class="scorebar"><div class="score" id="topName">—</div><div class="score" id="bottomName">—</div></div></div>
<div class="announce" id="announce">Ready</div>
<div class="controls"><button class="btn primary" id="kick">⚽ KICKOFF</button><button class="btn" id="auto">▶ AUTO</button><button class="btn" id="new">↻ NEW CUP</button></div>
<div class="settings"><div class="setting"><label>SPEED <b id="speedV">1.0×</b></label><input id="speed" type="range" min=".5" max="2" step=".1" value="1"></div><div class="setting"><label>CHAOS <b id="chaosV">50%</b></label><input id="chaos" type="range" min="0" max="100" value="50"></div></div>
<section class="panel"><div class="row"><span>TOURNAMENT</span><span id="teams">64 TEAMS</span></div><div class="rounds" id="rounds"></div></section>
<section class="panel"><div class="row"><span>COMMENTARY</span><span>LIVE</span></div><div class="feed" id="feed"></div></section>
<section class="champ" id="champ"><div class="cup">🏆</div><h2 id="champion">—</h2><div>WORLD CUP OF FLAGS CHAMPION</div><button class="btn primary" id="again">PLAY AGAIN</button></section>
</main>
<script>
const N=[['Argentina','ar'],['Australia','au'],['Austria','at'],['Belgium','be'],['Brazil','br'],['Bulgaria','bg'],['Cameroon','cm'],['Canada','ca'],['Chile','cl'],['China','cn'],['Colombia','co'],['Croatia','hr'],['Czechia','cz'],['Denmark','dk'],['Ecuador','ec'],['Egypt','eg'],['England','gb'],['Finland','fi'],['France','fr'],['Germany','de'],['Ghana','gh'],['Greece','gr'],['Hungary','hu'],['Iceland','is'],['India','in'],['Indonesia','id'],['Iran','ir'],['Ireland','ie'],['Italy','it'],['Jamaica','jm'],['Japan','jp'],['Kenya','ke'],['Mexico','mx'],['Morocco','ma'],['Netherlands','nl'],['New Zealand','nz'],['Nigeria','ng'],['Norway','no'],['Panama','pa'],['Paraguay','py'],['Peru','pe'],['Poland','pl'],['Portugal','pt'],['Qatar','qa'],['Romania','ro'],['Russia','ru'],['Saudi Arabia','sa'],['Senegal','sn'],['Serbia','rs'],['Singapore','sg'],['Slovakia','sk'],['Slovenia','si'],['South Africa','za'],['South Korea','kr'],['Spain','es'],['Sweden','se'],['Switzerland','ch'],['Tunisia','tn'],['Turkey','tr'],['Ukraine','ua'],['United States','us'],['Uruguay','uy'],['Vietnam','vn']];
const R=['R64','R32','R16','QF','SF','FINAL'],$=id=>document.getElementById(id),cv=$('arena'),ctx=cv.getContext('2d'),W=540,H=780,GOAL=190,BOUND=34,PLAYER_R=25;
let queue=[],winners=[],left,right,ps=[],ball,playing=false,auto=false,round=0,speed=1,chaos=50,last=0,acc=0,events=[],images={},goalLock=false,matchTime=0,kickoffDelay=0;
function resize(){const d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function log(s){events.unshift(s);$('feed').innerHTML=events.slice(0,24).map(x=>`<div class="event">${x}</div>`).join('')}
function flag(t){if(!images[t[1]]){const i=new Image();i.src='https://flagcdn.com/w160/'+t[1]+'.png';images[t[1]]=i}return images[t[1]]}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function unit(x,y){const d=Math.hypot(x,y)||1;return[x/d,y/d]}
function update(){const n=queue.length+winners.length+(left&&right?2:0);$('round').textContent=R[Math.min(round,5)];$('match').textContent=n>1?Math.ceil(n/2)+' MATCHES':'COMPLETE';$('teams').textContent=n+' '+(n===1?'TEAM':'TEAMS');$('progress').style.width=Math.max(0,Math.min(100,(64-n)/63*100))+'%';$('rounds').innerHTML=R.map((x,i)=>`<div class="round ${i===round?'active':''}">${x}</div>`).join('');if(left&&right){$('topName').textContent='⬇ '+right[0];$('bottomName').textContent='⬆ '+left[0]}}
function makePlayer(t,team){return{t,team,x:W/2,y:team?H*.80:H*.20,vx:0,vy:0,r:PLAYER_R,skill:.92+Math.random()*.18,hasBall:false,tackleCd:0,shotCd:.4+Math.random()*.5,attackBias:.9+Math.random()*.2}}
function setup(){if(queue.length<2){if(winners.length===1){champ(winners[0]);return}if(winners.length){queue=winners;winners=[];round++}else return}left=queue.shift();right=queue.shift();ps=[makePlayer(right,0),makePlayer(left,1)];ball={x:W/2,y:H/2,vx:0,vy:0,r:8,owner:-1};matchTime=0;goalLock=false;kickoffDelay=.8;update();$('announce').innerHTML=`⚽ <strong>${right[0]}</strong> vs <strong>${left[0]}</strong> — READY`;$('kick').textContent='⚽ KICKOFF'}
function kickoff(){if(!left)return;playing=true;$('kick').textContent='⏸ PAUSE';$('announce').innerHTML=`⚡ KICKOFF — players are fully autonomous`;log(`⚽ ${right[0]} vs ${left[0]} — kickoff`);kickoffDelay=.8}
function resetBall(){ball.owner=-1;ball.x=W/2;ball.y=H/2;ball.vx=(Math.random()<.5?-1:1)*(2.2+Math.random()*1.2);ball.vy=(Math.random()<.5?-1:1)*(2.2+Math.random()*1.2)}
function movePlayer(p,tx,ty,dt){let[nx,ny]=unit(tx-p.x,ty-p.y);const chaosBoost=.88+chaos/180;let accel=560*p.skill*chaosBoost;let max=170*(ball.owner===p.team?1.08:1);p.vx+=nx*accel*dt;p.vy+=ny*accel*dt;const drag=Math.pow(.84,dt*60);p.vx*=drag;p.vy*=drag;let v=Math.hypot(p.vx,p.vy);if(v>max){p.vx=p.vx/v*max;p.vy=p.vy/v*max}p.x=clamp(p.x+p.vx*dt,BOUND,W-BOUND);p.y=clamp(p.y+p.vy*dt,BOUND,H-BOUND)}
function takeBall(i){const p=ps[i];ball.owner=i;p.hasBall=true;ps[1-i].hasBall=false;ball.vx=ball.vy=0;$('announce').innerHTML=`⚡ <strong>${p.t[0]}</strong> has the ball`}
function shoot(i){const p=ps[i],goalY=i===0?H:0;const spread=(Math.random()-.5)*GOAL*.55;const dx=W/2+spread-p.x,dy=goalY-p.y;const[dX,dY]=unit(dx,dy);const power=520+Math.random()*130+chaos*1.2;ball.owner=-1;p.hasBall=false;ball.x=p.x+dX*28;ball.y=p.y+dY*28;ball.vx=dX*power;ball.vy=dY*power;p.shotCd=.9+Math.random()*1.2;$('announce').innerHTML=`🔥 <strong>${p.t[0]}</strong> SHOOTS!`;log(`🎯 ${p.t[0]} shoots toward goal`)}
function physics(dt){if(!playing||goalLock)return;matchTime+=dt;if(kickoffDelay>0){kickoffDelay-=dt;return}
const A=ps[0],B=ps[1];
for(let i=0;i<2;i++){const p=ps[i],opp=ps[1-i];p.tackleCd=Math.max(0,p.tackleCd-dt);p.shotCd=Math.max(0,p.shotCd-dt);let tx,ty;
if(ball.owner===i){const goalY=i===0?H:0;tx=W/2+(Math.sin(matchTime*1.7+i)*35);ty=goalY;movePlayer(p,tx,ty,dt)}
else if(ball.owner===1-i){const o=opp;tx=o.x;ty=o.y;movePlayer(p,tx,ty,dt)}
else{const d=Math.hypot(ball.x-p.x,ball.y-p.y);tx=ball.x;ty=ball.y;if(d>280){ty=p.team===0?H*.30:H*.70}movePlayer(p,tx,ty,dt)}
}
// body collision: separate players, but preserve forward velocity instead of locking them together
let dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||.001,min=PLAYER_R*2;if(d<min){const nx=dx/d,ny=dy/d,over=min-d;A.x-=nx*over*.5;A.y-=ny*over*.5;B.x+=nx*over*.5;B.y+=ny*over*.5;const rel=(B.vx-A.vx)*nx+(B.vy-A.vy)*ny;if(rel<0){const impulse=-rel*.55;A.vx-=nx*impulse;A.vy-=ny*impulse;B.vx+=nx*impulse;B.vy+=ny*impulse}}
// possession and tackles
if(ball.owner<0){for(let i=0;i<2;i++){const p=ps[i];if(Math.hypot(ball.x-p.x,ball.y-p.y)<PLAYER_R+ball.r+12){takeBall(i);break}}}
if(ball.owner>=0){const i=ball.owner,p=ps[i],opp=ps[1-i];const goalY=i===0?H:0,distGoal=Math.abs(goalY-p.y);ball.x=p.x;ball.y=p.y+(i===0?-28:28);ball.vx=p.vx;ball.vy=p.vy;
const distOpp=Math.hypot(p.x-opp.x,p.y-opp.y);if(distOpp<58&&opp.tackleCd<=0){opp.tackleCd=.75+Math.random()*.65;const tackleChance=.38+chaos*.002;if(Math.random()<tackleChance){takeBall(1-i);log(`💥 ${opp.t[0]} wins the tackle`);opp.vx+=(p.x-opp.x)*1.5;opp.vy+=(p.y-opp.y)*1.5}}
if(ball.owner===i&&distGoal<260&&p.shotCd<=0){const shootChance=(.32+chaos*.002)*dt;if(Math.random()<shootChance)shoot(i)}}
else{ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;const drag=Math.pow(.985,dt*60);ball.vx*=drag;ball.vy*=drag;if(Math.abs(ball.vx)<5)ball.vx=0;if(Math.abs(ball.vy)<5)ball.vy=0;if(ball.x<BOUND+5){ball.x=BOUND+5;ball.vx=Math.abs(ball.vx)*.82}if(ball.x>W-BOUND-5){ball.x=W-BOUND-5;ball.vx=-Math.abs(ball.vx)*.82}}
const inGoal=ball.x>W/2-GOAL/2&&ball.x<W/2+GOAL/2;if(ball.y<0&&inGoal)score(B);else if(ball.y>H&&inGoal)score(A);else{if(ball.y<12){ball.y=12;ball.vy=Math.abs(ball.vy)*.82}if(ball.y>H-12){ball.y=H-12;ball.vy=-Math.abs(ball.vy)*.82}}
// Golden-goal fallback: never a random winner; force a live shot from whoever has possession.
if(matchTime>35&&!goalLock){if(ball.owner>=0){shoot(ball.owner)}else if(matchTime>38){const i=matchTime%2<1?0:1;ps[i].x=W/2;ps[i].y=i===0?H*.68:H*.32;takeBall(i);shoot(i)}}}
function score(w){if(!playing||goalLock)return;goalLock=true;playing=false;const loser=w===ps[0]?ps[1]:ps[0];winners.push(w.t);$('box').classList.add('goal');$('announce').innerHTML=`⚽ <strong>${w.t[0]}</strong> SCORES! — ${loser.t[0]} ELIMINATED`;log(`🥅 GOAL — ${w.t[0]} defeats ${loser.t[0]}`);$('kick').textContent='⚽ NEXT';setTimeout(()=>{$('box').classList.remove('goal');left=right=null;goalLock=false;setup()},Math.max(700,900/speed))}
function drawPitch(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#08752f';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffffbb';ctx.lineWidth=3;ctx.strokeRect(18,18,W-36,H-36);ctx.beginPath();ctx.moveTo(18,H/2);ctx.lineTo(W-18,H/2);ctx.stroke();ctx.beginPath();ctx.arc(W/2,H/2,63,0,Math.PI*2);ctx.stroke();ctx.strokeRect(W/2-GOAL/2,18,GOAL,65);ctx.strokeRect(W/2-GOAL/2,H-83,GOAL,65);ctx.strokeRect(W/2-75,18,150,180);ctx.strokeRect(W/2-75,H-198,150,180);ctx.beginPath();ctx.arc(W/2,198,55,0,Math.PI);ctx.stroke();ctx.beginPath();ctx.arc(W/2,H-198,55,Math.PI,Math.PI*2);ctx.stroke();ctx.fillStyle='#ffffff22';ctx.fillRect(W/2-GOAL/2,0,GOAL,18);ctx.fillRect(W/2-GOAL/2,H-18,GOAL,18)}
function drawPlayer(p){ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,29,23,7,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(0,0,27,0,Math.PI*2);ctx.clip();const im=flag(p.t);if(im.complete&&im.naturalWidth)ctx.drawImage(im,-27,-27,54,54);else{ctx.fillStyle='#eee';ctx.fillRect(-27,-27,54,54);ctx.fillStyle='#d22';ctx.fillRect(-27,-3,54,6)}ctx.restore();ctx.strokeStyle=p.team?'#5fe7ff':'#ffd65a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,30,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.font='900 9px system-ui';ctx.textAlign='center';ctx.fillText(p.t[0],p.x,p.y+43);if(p.hasBall){ctx.fillStyle='#ffd65a';ctx.beginPath();ctx.arc(p.x,p.y-34,4,0,Math.PI*2);ctx.fill()}}
function draw(){drawPitch();for(const p of ps)drawPlayer(p);if(ball){ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=9;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#111';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText('⚽',ball.x,ball.y+4)}}
function loop(t){if(!last)last=t;let frame=Math.min(.05,(t-last)/1000)*speed;last=t;acc+=frame;while(acc>=1/60){physics(1/60);acc-=1/60}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function champ(c){playing=false;left=right=null;$('round').textContent='CHAMPION';$('match').textContent='COMPLETE';$('teams').textContent='1 CHAMPION';$('progress').style.width='100%';$('champion').textContent=c[0];$('champ').classList.add('show');$('announce').innerHTML=`🏆 <strong>${c[0]}</strong> IS CHAMPION!`;log(`👑 ${c[0]} won the tournament`)}
function newCup(){playing=false;round=0;queue=shuffle(N).slice(0,64);winners=[];left=right=null;events=[];$('feed').innerHTML='';$('champ').classList.remove('show');setup()}
$('kick').onclick=()=>playing?(playing=false,$('kick').textContent='⚽ RESUME'):kickoff();$('new').onclick=newCup;$('again').onclick=newCup;$('auto').onclick=()=>{auto=!auto;$('auto').textContent=auto?'⏸ AUTO':'▶ AUTO';if(auto&&!playing)kickoff()};$('speed').oninput=e=>{speed=+e.target.value;$('speedV').textContent=speed.toFixed(1)+'×'};$('chaos').oninput=e=>{chaos=+e.target.value;$('chaosV').textContent=chaos+'%'};$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();newCup();
</script></body></html>
