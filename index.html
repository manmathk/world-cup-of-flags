<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Cup of Flags</title><style>html,body{margin:0;background:#050912;color:#fff;font-family:system-ui}body{display:flex;justify-content:center}.app{width:min(100%,540px);padding:12px;min-height:100vh;background:radial-gradient(circle at 50% 0,#173b63,#07101c 42%,#050912)}h1{text-align:center;margin:2px 0;font-size:28px;line-height:.95}header{text-align:center}.live{font-size:9px;color:#ff647b;font-weight:900;letter-spacing:2px}.sub{font-size:10px;color:#91a0bd;margin:7px}.panel{background:#0b1525;border:1px solid #203552;border-radius:14px;padding:9px;margin-top:9px}.row{display:flex;justify-content:space-between;font-size:9px;font-weight:900}.bar{height:5px;background:#1a2940;border-radius:9px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#39d7ff,#a855ff)}#arena{display:block;width:100%;aspect-ratio:9/12;margin-top:9px;border:2px solid #294760;border-radius:16px;background:#08752f;box-shadow:0 18px 45px #0009}.announce{text-align:center;min-height:34px;padding:7px;font-size:11px;font-weight:900}.buttons{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px}.btn{border:1px solid #29405e;background:#111e31;color:#fff;border-radius:10px;padding:10px 5px;font-size:9px;font-weight:900}.primary{background:linear-gradient(135deg,#3976ff,#a544ff);border:0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.control{background:#0e1a2b;border:1px solid #203650;border-radius:10px;padding:7px;font-size:8px}.control label{display:flex;justify-content:space-between;color:#91a0bc}.control input{width:100%;accent-color:#6b7cff}.rounds{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:7px}.round{padding:6px 2px;text-align:center;border-radius:7px;background:#142137;color:#6e7e9e;font-size:7px;font-weight:900}.round.active{background:#30477a;color:#fff}.feed{max-height:110px;overflow:auto}.event{font-size:8px;color:#91a0b8;padding:5px 0;border-bottom:1px solid #17263b}.champ{display:none;text-align:center;padding:20px;margin-top:9px;border-radius:16px;background:radial-gradient(circle,#634b1a,#151521 60%);border:1px solid #b28b38}.champ.show{display:block}.cup{font-size:45px}.champ h2{margin:4px;font-size:24px}@media(max-width:380px){.app{padding:8px}.buttons{grid-template-columns:1fr 1fr}.buttons .primary{grid-column:1/3}}</style></head><body><main class="app"><header><div class="live">● LIVE AUTOMATED TOURNAMENT</div><h1>WORLD CUP<br>OF FLAGS</h1><div class="sub">Two automated footballers. One goal. One survivor.</div></header><section class="panel"><div class="row"><span id="roundName">ROUND OF 64</span><span id="matchInfo">32 MATCHES</span></div><div class="bar"><i id="progress"></i></div></section><canvas id="arena"></canvas><div class="announce" id="announce">Loading match…</div><div class="buttons"><button class="btn primary" id="kick">⚽ KICKOFF</button><button class="btn" id="auto">▶ AUTO</button><button class="btn" id="new">↻ NEW CUP</button></div><div class="controls"><div class="control"><label>Speed <b id="speedVal">1.0×</b></label><input id="speed" type="range" min=".5" max="2" step=".1" value="1"></div><div class="control"><label>Chaos <b id="chaosVal">50%</b></label><input id="chaos" type="range" min="0" max="100" value="50"></div></div><section class="panel"><div class="row"><span>TOURNAMENT</span><span id="teamsLeft">64 TEAMS</span></div><div class="rounds" id="rounds"></div></section><section class="panel"><div class="row"><span>LIVE COMMENTARY</span><span>● LIVE</span></div><div class="feed" id="feed"></div></section><section class="champ" id="champ"><div class="cup">🏆</div><h2 id="champion">—</h2><div>WORLD CUP OF FLAGS CHAMPION</div><button class="btn primary" id="again" style="margin-top:10px;width:100%">PLAY AGAIN</button></section></main><script>
const N=[['Argentina','ar'],['Australia','au'],['Austria','at'],['Belgium','be'],['Brazil','br'],['Bulgaria','bg'],['Cameroon','cm'],['Canada','ca'],['Chile','cl'],['China','cn'],['Colombia','co'],['Croatia','hr'],['Czechia','cz'],['Denmark','dk'],['Ecuador','ec'],['Egypt','eg'],['England','gb'],['Finland','fi'],['France','fr'],['Germany','de'],['Ghana','gh'],['Greece','gr'],['Hungary','hu'],['Iceland','is'],['India','in'],['Indonesia','id'],['Iran','ir'],['Ireland','ie'],['Italy','it'],['Jamaica','jm'],['Japan','jp'],['Kenya','ke'],['Mexico','mx'],['Morocco','ma'],['Netherlands','nl'],['New Zealand','nz'],['Nigeria','ng'],['Norway','no'],['Panama','pa'],['Paraguay','py'],['Peru','pe'],['Poland','pl'],['Portugal','pt'],['Qatar','qa'],['Romania','ro'],['Russia','ru'],['Saudi Arabia','sa'],['Senegal','sn'],['Serbia','rs'],['Singapore','sg'],['Slovakia','sk'],['Slovenia','si'],['South Africa','za'],['South Korea','kr'],['Spain','es'],['Sweden','se'],['Switzerland','ch'],['Tunisia','tn'],['Turkey','tr'],['Ukraine','ua'],['United States','us'],['Uruguay','uy'],['Vietnam','vn']];
const rounds=['ROUND OF 64','ROUND OF 32','ROUND OF 16','QUARTERFINALS','SEMIFINALS','GRAND FINAL'];const $=id=>document.getElementById(id),cv=$('arena'),ctx=cv.getContext('2d');let W=540,H=720,dpr=1;let queue=[],nextRound=[],left,right,ball,playing=false,auto=false,round=0,matchNo=0,speed=1,chaos=50,last=0,events=[],images={};
function resize(){dpr=devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;cv.style.aspectRatio='9/12';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function flag(t){if(!images[t[1]]){const im=new Image();im.src='https://flagcdn.com/w320/'+t[1]+'.png';images[t[1]]=im}return images[t[1]]}function log(s){events.unshift(s);$('feed').innerHTML=events.slice(0,24).map(x=>'<div class="event">'+x+'</div>').join('')}function update(){let remaining=queue.length+nextRound.length+(left&&right?2:0);let stage=Math.min(round,5);$('roundName').textContent=rounds[stage];$('matchInfo').textContent=Math.max(0,Math.ceil(remaining/2))+' MATCHES';$('teamsLeft').textContent=remaining+' TEAMS';$('progress').style.width=((64-remaining)/63*100)+'%';$('rounds').innerHTML=rounds.map((x,i)=>'<div class="round '+(i===stage?'active':'')+'">'+x.replace('ROUND OF ','R') .replace('QUARTERFINALS','QF').replace('SEMIFINALS','SF').replace('GRAND FINAL','FINAL')+'</div>').join('')}
function makePlayer(team,x){return {team,x,y:H/2+(Math.random()-.5)*160,vx:0,vy:0,r:27,stamina:.9+Math.random()*.2}}function setupMatch(){if(queue.length<2){if(nextRound.length===1){champ(nextRound[0]);return}queue=nextRound;nextRound=[];round++;if(queue.length<2){champ(queue[0]);return}}left=queue.shift();right=queue.shift();$('announce').innerHTML='⚽ <b>'+left[0]+'</b> vs <b>'+right[0]+'</b> — READY';update()}
function kickoff(){if(!left||!right)return;const p0=makePlayer(left,100),p1=makePlayer(right,W-100);ball={x:W/2,y:H/2,vx:(Math.random()<.5?-1:1)*2.5,vy:(Math.random()-.5)*2,r:8,owner:-1};state=[p0,p1];playing=true;$('kick').textContent='⏸ PAUSE';$('announce').innerHTML='⚡ KICKOFF — '+left[0]+' vs '+right[0];log('⚽ Kickoff: <b>'+left[0]+'</b> vs <b>'+right[0]+'</b>')}
let state=[];
function physics(dt){if(!playing)return;for(let i=0;i<2;i++){const p=state[i],goalX=i?55:W-55;let tx=goalX-p.x,ty=H/2-p.y;const dx=ball.x-p.x,dy=ball.y-p.y,dist=Math.hypot(dx,dy)||1;if(ball.owner!==i&&dist<170){tx=dx;ty=dy}const len=Math.hypot(tx,ty)||1;let accel=.075*p.stamina*(.75+chaos/250);p.vx+=tx/len*accel;p.vy+=ty/len*accel;p.vx*=.965;p.vy*=.965;let max=2.7*p.stamina;if(ball.owner===i)max=3.0;const v=Math.hypot(p.vx,p.vy);if(v>max){p.vx=p.vx/v*max;p.vy=p.vy/v*max}p.x=Math.max(34,Math.min(W-34,p.x+p.vx*dt));p.y=Math.max(34,Math.min(H-34,p.y+p.vy*dt))}
const a=state[0],b=state[1],pd=Math.hypot(a.x-b.x,a.y-b.y);if(pd<a.r+b.r){const nx=(b.x-a.x)/(pd||1),ny=(b.y-a.y)/(pd||1);a.vx-=nx*.8;b.vx+=nx*.8;a.vy-=ny*.8;b.vy+=ny*.8;if(ball.owner>=0&&Math.random()<.2+chaos/300)ball.owner=1-ball.owner}
if(ball.owner>=0){const p=state[ball.owner],dir=p.team? -1:1;ball.x=p.x+dir*25;ball.y=p.y;ball.vx=p.vx;ball.vy=p.vy;const targetX=p.team?0:W,near=Math.abs(targetX-p.x)<145;if(near&&Math.random()<(.010+chaos*.00005)*dt){ball.owner=-1;ball.vx=(p.team?-1:1)*(7+Math.random()*3);ball.vy=(Math.random()-.5)*4;$('announce').innerHTML='🔥 <b>'+p.t[0]+'</b> SHOOTS!'}}else{ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=.994;ball.vy*=.994;for(let i=0;i<2;i++){const p=state[i],d=Math.hypot(ball.x-p.x,ball.y-p.y);if(d<p.r+ball.r+7){ball.owner=i;ball.vx=ball.vy=0;$('announce').innerHTML='⚡ <b>'+p.t[0]+'</b> wins possession';break}}}if(ball.y<18||ball.y>H-18){ball.vy*=-.85;ball.y=Math.max(18,Math.min(H-18,ball.y))}if(ball.x<-8){score(1)}else if(ball.x>W+8){score(0)}}
function score(wi){if(!playing)return;playing=false;const winner=wi?right:left,loser=wi?left:right;nextRound.push(winner);matchNo++;$('announce').innerHTML='🥅 <b>'+winner[0]+'</b> SCORES! <span>'+loser[0]+' ELIMINATED</span>';log('🥅 GOAL — <b>'+winner[0]+'</b> eliminated <b>'+loser[0]+'</b>');$('kick').textContent='⚽ NEXT';update();setTimeout(()=>{left=right=null;if(nextRound.length===queue.length+1&&queue.length===0){champ(nextRound[0])}else setupMatch();},Math.max(500,1000/speed))}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#08752f';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffffaa';ctx.lineWidth=3;ctx.strokeRect(16,16,W-32,H-32);ctx.beginPath();ctx.moveTo(W/2,16);ctx.lineTo(W/2,H-16);ctx.stroke();ctx.beginPath();ctx.arc(W/2,H/2,62,0,Math.PI*2);ctx.stroke();ctx.strokeRect(16,H/2-105,50,210);ctx.strokeRect(W-66,H/2-105,50,210);ctx.fillStyle='#fff';ctx.fillRect(0,H/2-65,12,130);ctx.fillRect(W-12,H/2-65,12,130);ctx.font='bold 10px system-ui';ctx.textAlign='center';for(let i=0;i<2;i++){const p=state[i];if(!p)continue;ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(0,28,25,8,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(0,0,28,0,Math.PI*2);ctx.clip();const im=flag(p.t);if(im.complete&&im.naturalWidth)ctx.drawImage(im,-28,-28,56,56);else{ctx.fillStyle='#ddd';ctx.fillRect(-28,-28,56,56)}ctx.restore();ctx.strokeStyle=i?'#ffd65a':'#5ee7ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,31,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.fillText(p.t[0],p.x,p.y+44)}if(ball){ctx.fillStyle='#fff';ctx.shadowBlur=12;ctx.shadowColor='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.font='13px sans-serif';ctx.fillStyle='#111';ctx.fillText('⚽',ball.x,ball.y+4)}}
function loop(t){if(!last)last=t;let dt=Math.min(.04,(t-last)/1000)*60*speed;last=t;physics(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function champ(c){playing=false;left=right=null;$('roundName').textContent='CHAMPION';$('matchInfo').textContent='COMPLETE';$('teamsLeft').textContent='1 CHAMPION';$('progress').style.width='100%';$('champion').textContent=c[0];$('champ').classList.add('show');$('announce').innerHTML='🏆 <b>'+c[0]+'</b> is the WORLD CUP OF FLAGS CHAMPION!';log('👑 <b>'+c[0]+'</b> wins the tournament');$('kick').textContent='⚽ KICKOFF'}function newCup(){playing=false;round=0;matchNo=0;events=[];$('feed').innerHTML='';$('champ').classList.remove('show');queue=shuffle(N).slice(0,64);nextRound=[];left=right=null;update();setupMatch()}$('kick').onclick=()=>{if(playing){playing=false;$('kick').textContent='⚽ RESUME'}else kickoff()};$('new').onclick=newCup;$('again').onclick=newCup;$('auto').onclick=()=>{auto=!auto;$('auto').textContent=auto?'⏸ AUTO':'▶ AUTO';if(auto&&!playing)kickoff()};$('speed').oninput=e=>{speed=+e.target.value;$('speedVal').textContent=speed.toFixed(1)+'×'};$('chaos').oninput=e=>{$('chaosVal').textContent=e.target.value+'%';chaos=+e.target.value};newCup();
</script></body></html>
