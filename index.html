<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="World Cup of Flags — a 64-flag knockout on a football pitch. Bundle your rival into their own net.">
<title>World Cup of Flags</title>
<style>
:root{
  --bg:#05080f; --panel:#0d1725; --panel2:#122135; --line:#22364e;
  --text:#eaf1fb; --muted:#8ba0bd;
  --blue:#38bdf8; --red:#fb5c7d; --gold:#f5c451; --grad:linear-gradient(135deg,#3b82f6,#8b5cf6);
  --r:12px; --tap:44px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:400 14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex; justify-content:center;
  -webkit-text-size-adjust:100%;
}
.app{
  width:min(100%,600px); min-height:100dvh;
  padding:12px 14px calc(20px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 60% at 50% 0,#16345a 0%,#0a1523 45%,var(--bg) 90%);
}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.topBtns{display:flex;gap:6px}
.btn.icon[aria-pressed="false"]{opacity:.42}
.live{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--red)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}

/* ---- buttons ---- */
.btn{
  min-height:var(--tap); padding:10px 14px;
  border:1px solid var(--line); border-radius:var(--r);
  background:var(--panel2); color:var(--text);
  font:700 13px/1 system-ui,sans-serif; letter-spacing:.03em;
  cursor:pointer; transition:transform .08s,filter .15s,opacity .15s;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn:hover{filter:brightness(1.18)}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn.primary{background:var(--grad);border-color:transparent}
.btn.slam{background:linear-gradient(135deg,#f59e0b,#ef4444);border-color:transparent}
.btn.big{width:100%;min-height:52px;font-size:15px;margin-top:12px}
.btn.icon{min-width:var(--tap);padding:10px}

/* ---- menu ---- */
.screen{display:none}
.screen.show{display:block}
.title{
  text-align:center;font-size:clamp(30px,9vw,42px);font-weight:900;
  line-height:.92;letter-spacing:-.02em;margin:14px 0 0;
}
.title span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{text-align:center;color:var(--muted);font-size:13px;margin:10px 0 16px}
.modeRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.mode{min-height:var(--tap);border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  color:var(--muted);font:700 13px/1 system-ui,sans-serif;cursor:pointer}
.mode.active{background:var(--grad);border-color:transparent;color:#fff}
.mode:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.panelHead{display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.muted{color:var(--muted);font-weight:600;letter-spacing:.04em}

.search{
  width:100%;margin:10px 0;padding:11px 12px;min-height:42px;
  background:#0a1422;border:1px solid var(--line);border-radius:10px;
  color:var(--text);font-size:14px;
}
.search:focus{outline:none;border-color:var(--blue)}
.flagGrid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px;
  max-height:290px;overflow-y:auto;padding-right:4px;
}
.flagCell{
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;
  background:var(--panel2);border:1px solid transparent;border-radius:10px;
  cursor:pointer;font:600 10px/1.2 system-ui,sans-serif;color:var(--muted);text-align:center;
}
.flagCell img{width:34px;height:23px;object-fit:cover;border-radius:3px;background:#26364a}
.flagCell.sel{border-color:var(--gold);background:#1d2740;color:var(--text)}
.flagCell:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:12px;padding:18px}

/* ---- progress ---- */
.bar{height:6px;background:#16263c;border-radius:99px;margin:10px 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--grad);transition:width .35s}
.rounds{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.round{padding:7px 2px;background:#16263c;border-radius:7px;text-align:center;
  color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.03em}
.round.done{background:#1b3b32;color:#5fd6a4}
.round.active{background:var(--grad);color:#fff}

/* ---- versus ---- */
.vs{display:flex;align-items:stretch;gap:8px;margin-bottom:8px}
.side{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-left-width:4px;
  border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.side.blue{border-left-color:var(--blue)}
.side.red{border-left-color:var(--red);text-align:right}
.side .nm{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .dmg{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}
.side.blue .dmg{color:var(--blue)}
.side.red .dmg{color:var(--red)}
.you{display:inline-block;margin-left:5px;padding:1px 5px;border-radius:4px;
  background:var(--gold);color:#241c00;font-size:9px;font-weight:900;vertical-align:1px}
.vsx{align-self:center;font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.1em}

/* ---- arena ---- */
.arenaBox{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:#071322;box-shadow:0 18px 44px #0009;touch-action:none;
  /* Static safety cap only. The real per-device fit is measured in fitArena();
     an earlier viewport-unit calc went negative in landscape and max-width clamped
     it to 0, which hid the pitch completely. Never reintroduce an unfloored calc. */
  max-width:min(100%,420px); margin:0 auto}
.arena{display:block;width:100%;height:auto;aspect-ratio:9/13}
.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
  padding:6px 12px;border-radius:99px;background:#04101cd9;border:1px solid #ffffff26;
  font-size:11px;font-weight:700;color:#cfe0f5;white-space:nowrap;pointer-events:none}
.announce{min-height:30px;margin:8px 0;text-align:center;font-size:14px;font-weight:700;line-height:1.3}
.announce strong{color:var(--gold)}

.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:7px}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.setting{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.setting label{display:flex;justify-content:space-between;font-size:11px;font-weight:800;
  letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.setting label b{color:var(--text)}
.setting input[type=range]{width:100%;accent-color:#6d8bff;height:22px}

.feed{max-height:132px;overflow-y:auto;margin-top:8px}
.event{padding:6px 0;border-bottom:1px solid #17273c;color:#a9bcd6;font-size:12px}
.event:last-child{border-bottom:0}

/* ---- champion ---- */
.champWrap{text-align:center;padding:26px 18px;border-radius:16px;
  background:radial-gradient(circle at 50% 0,#5d4718,#191722 65%);border:1px solid #b18a3c}
.cup{font-size:56px;line-height:1}
.champWrap h2{font-size:26px;margin:10px 0 4px}
.champSub{font-size:11px;letter-spacing:.16em;color:#d3c391;font-weight:800}
.champFlag{width:74px;height:50px;object-fit:cover;border-radius:6px;margin-top:14px;
  box-shadow:0 6px 20px #0008}

/* Short viewports: shed chrome so the pitch and the controls both fit. */
@media (max-height:680px){
  .rounds{display:none}
  .panel{padding:9px}
  .vs{margin-bottom:6px}
  .side{padding:6px 9px}
  .side .dmg{font-size:15px}
  .announce{min-height:24px;margin:6px 0;font-size:13px}
  .controls{gap:6px;margin-bottom:6px}
  .title{margin-top:6px}
  .flagGrid{max-height:200px}
}
@media (max-width:380px){
  .controls{grid-template-columns:1fr 1fr}
  .flagGrid{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
}
/* Landscape phones are wide and very short. Stacking a portrait pitch above the
   controls forces constant scrolling, so split into two columns instead: the pitch
   sized to the viewport height on the left, the rest scrolling on the right. */
@media (orientation:landscape) and (max-height:560px){
  .app{width:100%;max-width:100%}
  #scrGame.show{
    display:grid; grid-template-columns:auto minmax(0,1fr); grid-template-rows:auto 1fr;
    column-gap:12px; row-gap:8px; align-items:stretch;   /* stretch, so row 2 can clip */
  }
  #scrGame.show > .arenaBox{grid-column:1; grid-row:1 / span 2; margin:0; align-self:start}
  /* score and progress sit side by side, so the controls get the vertical space */
  #scrGame.show > .gameTop{
    grid-column:2; grid-row:1; min-width:0;
    display:grid; grid-template-columns:1fr 1fr; gap:8px; align-items:start;
  }
  #scrGame.show > .gameTop > .panel,
  #scrGame.show > .gameTop > .vs{margin-bottom:0}
  #scrGame.show > .gameBottom{grid-column:2; grid-row:2; min-width:0; min-height:0; overflow-y:auto}
  #scrGame.show .panel{margin-bottom:8px}
  #scrGame.show .settings{margin:8px 0}
  .feed{max-height:96px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="live"><i></i>WORLD CUP OF FLAGS</div>
    <div class="topBtns">
      <button class="btn icon" id="sfxBtn" aria-label="Toggle sound" aria-pressed="true" title="Sound">🔊</button>
      <button class="btn icon" id="voiceBtn" aria-label="Toggle commentary" aria-pressed="true" title="Commentary">🎙</button>
      <button class="btn icon" id="fs" aria-label="Toggle fullscreen" title="Fullscreen">⛶</button>
    </div>
  </header>

  <!-- ============ MENU ============ -->
  <section id="scrMenu" class="screen show">
    <h1 class="title">WORLD CUP<br><span>OF FLAGS</span></h1>
    <p class="tagline">64 flags, one pitch. Bundle your rival into the goal they’re defending.</p>

    <div class="modeRow" role="radiogroup" aria-label="Mode">
      <button class="mode active" id="modePlay" role="radio" aria-checked="true">🎮 PLAY</button>
      <button class="mode" id="modeWatch" role="radio" aria-checked="false">👁 WATCH</button>
    </div>

    <div class="panel">
      <div class="panelHead"><span>Pick your flag</span><span class="muted" id="pickedName">Random</span></div>
      <input id="search" class="search" type="search" placeholder="Search 64 countries…" autocomplete="off" aria-label="Search countries">
      <div id="flagGrid" class="flagGrid" role="listbox" aria-label="Choose your flag"></div>
    </div>

    <button id="start" class="btn primary big">START THE CUP</button>
  </section>

  <!-- ============ GAME ============ -->
  <section id="scrGame" class="screen">
    <div class="gameTop">
    <div class="panel">
      <div class="panelHead"><span id="roundName">Round of 64</span><span class="muted" id="matchCount">32 battles</span></div>
      <div class="bar"><i id="progress"></i></div>
      <div class="rounds" id="rounds"></div>
    </div>

    <div class="vs">
      <div class="side blue"><span class="nm" id="nameA">—</span><span class="dmg" id="dmgA">0%</span></div>
      <span class="vsx">VS</span>
      <div class="side red"><span class="nm" id="nameB">—</span><span class="dmg" id="dmgB">0%</span></div>
    </div>
    </div>

    <div class="arenaBox" id="box">
      <canvas id="arena" class="arena" width="540" height="780" aria-label="Match pitch"></canvas>
      <div class="hint" id="hint"></div>
    </div>

    <div class="gameBottom">
    <p class="announce" id="announce" role="status" aria-live="polite">Ready</p>

    <div class="controls">
      <button id="fight" class="btn primary">⚡ FIGHT</button>
      <button id="slam" class="btn slam">💥 SLAM</button>
      <button id="auto" class="btn">▶ AUTO</button>
    </div>
    <div class="controls">
      <button id="modeToggle" class="btn">👁 WATCH</button>
      <button id="simRest" class="btn">⏩ SIM REST</button>
      <button id="newCup" class="btn">↻ NEW CUP</button>
    </div>

    <div class="settings">
      <div class="setting"><label for="speed">SPEED <b id="speedV">1.0×</b></label>
        <input id="speed" type="range" min=".5" max="2" step=".1" value="1"></div>
      <div class="setting"><label for="impact">IMPACT <b id="impactV">80%</b></label>
        <input id="impact" type="range" min="30" max="100" step="5" value="80"></div>
    </div>

    <section class="panel">
      <div class="panelHead"><span>Commentary</span><span class="muted">Live</span></div>
      <div class="feed" id="feed"></div>
    </section>
    </div>
  </section>

  <!-- ============ CHAMPION ============ -->
  <section id="scrChamp" class="screen">
    <div class="champWrap">
      <div class="cup">🏆</div>
      <h2 id="champName">—</h2>
      <div class="champSub">WORLD CUP OF FLAGS CHAMPION</div>
      <img id="champFlag" class="champFlag" alt="" width="74" height="50">
      <button id="again" class="btn primary big">PLAY AGAIN</button>
    </div>
  </section>
</main>

<script>
/* ==SIM-CORE-START== */
/* Pure simulation — no DOM, no browser APIs. tests/headless.mjs evaluates this block directly. */

const FLAGS=[
['Argentina','ar'],['Australia','au'],['Austria','at'],['Belgium','be'],['Brazil','br'],
['Bulgaria','bg'],['Cameroon','cm'],['Canada','ca'],['Chile','cl'],['China','cn'],
['Colombia','co'],['Croatia','hr'],['Czechia','cz'],['Denmark','dk'],['Ecuador','ec'],
['Egypt','eg'],['England','gb-eng'],['Finland','fi'],['France','fr'],['Germany','de'],
['Ghana','gh'],['Greece','gr'],['Hungary','hu'],['Iceland','is'],['India','in'],
['Indonesia','id'],['Iran','ir'],['Ireland','ie'],['Italy','it'],['Jamaica','jm'],
['Japan','jp'],['Kenya','ke'],['Mexico','mx'],['Morocco','ma'],['Netherlands','nl'],
['New Zealand','nz'],['Nigeria','ng'],['Norway','no'],['Panama','pa'],['Paraguay','py'],
['Peru','pe'],['Poland','pl'],['Portugal','pt'],['Qatar','qa'],['Romania','ro'],
['Russia','ru'],['Saudi Arabia','sa'],['Scotland','gb-sct'],['Senegal','sn'],['Serbia','rs'],
['Singapore','sg'],['Slovakia','sk'],['Slovenia','si'],['South Africa','za'],['South Korea','kr'],
['Spain','es'],['Sweden','se'],['Switzerland','ch'],['Tunisia','tn'],['Turkey','tr'],
['Ukraine','ua'],['United States','us'],['Uruguay','uy'],['Vietnam','vn']];

const ROUNDS=['Round of 64','Round of 32','Round of 16','Quarterfinals','Semifinals','Grand Final'];
const ROUND_TAGS=['R64','R32','R16','QF','SF','FINAL'];

const DT=1/60;

/* Portrait football pitch, same geometry the football build used. */
const ARENA={w:540,h:780,cx:270,cy:390};
const MARGIN=18;                      // touchline inset — matches the drawn pitch
const FIGHTER_R=34;
const GOAL_W=170;                     // goal mouth at kickoff
const GOAL_W_MAX=ARENA.w-MARGIN*2;    // sudden death stretches it across the whole goal line
const GOAL_GROW=80;                   // px/s
const GOAL_DANGER=190;                // how deep into its own half the AI starts panicking
const SUDDEN_DEATH=8;
const HARD_CAP=45;
const DRAG=0.965;
const WALL_BOUNCE=0.78;
const THRUST_CAP=9;                   // top speed a flag reaches under its own steering
const DASH_CAP=15;
const LAUNCH_CAP=26;                  // knockback may exceed the steering cap — that is a launch
const THRUST=0.45;
const DASH_IMPULSE=7.6;

function mulberry32(seed){
  let t=seed>>>0;
  return function(){
    t=(t+0x6D2B79F5)>>>0;
    let x=Math.imul(t^(t>>>15),1|t);
    x=(x+Math.imul(x^(x>>>7),61|x))^x;
    return ((x^(x>>>14))>>>0)/4294967296;
  };
}
function shuffle(list,rng){
  const out=list.slice();
  for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]]}
  return out;
}
const hypot=(x,y)=>Math.sqrt(x*x+y*y);

/* Team 0 defends the top goal, team 1 the bottom. You lose by being bundled into
   the goal you are defending, so every shove is a shove backwards. */
const goalLine=team=>team?ARENA.h-MARGIN:MARGIN;
const ownDepth=p=>p.team?ARENA.h-p.y:p.y;          // distance from your own goal line

function createFighter(flag,team,rng){
  return {
    flag, team,
    x:ARENA.cx, y:team?ARENA.h*0.64:ARENA.h*0.36,
    vx:0, vy:0, r:FIGHTER_R,
    damage:0, stamina:1,
    dashCd:0.9, dashing:0, launch:0, stun:0, hitCd:0, spin:0,
    skill:0.82+rng()*0.36, aggression:0.7+rng()*0.6, power:0.88+rng()*0.26,
    human:false, conceded:false,
    input:{dx:0,dy:0,dash:false,given:false}
  };
}

function createMatch(flagA,flagB,seed,opts){
  opts=opts||{};
  const rng=mulberry32(seed);
  const m={
    a:createFighter(flagA,0,rng), b:createFighter(flagB,1,rng),
    rng, time:0, goalW:GOAL_W,
    started:false, over:false,
    winner:null, loser:null, reason:null,
    impact:opts.impact==null?80:opts.impact,
    hits:0, events:[], suddenAnnounced:false
  };
  if(opts.humanTeam===0)m.a.human=true;
  if(opts.humanTeam===1)m.b.human=true;
  return m;
}

function tickFighter(p){
  p.stun=Math.max(0,p.stun-DT);
  p.hitCd=Math.max(0,p.hitCd-DT);
  p.dashCd=Math.max(0,p.dashCd-DT);
  p.dashing=Math.max(0,p.dashing-DT);
  p.launch=Math.max(0,p.launch-DT);
  p.stamina=Math.min(1,p.stamina+0.22*DT);
  p.spin+=hypot(p.vx,p.vy)*0.06;
}

/* The AI works the goal line: it gets goal-side of nobody and instead gets in front,
   lining the opponent up with their own net before it commits to a shove. */
function aiThink(p,o,m){
  const pushDir=o.team?1:-1;                 // direction that drives the opponent into their net
  const myDepth=ownDepth(p), foeDepth=ownDepth(o);
  const mouth=m.goalW/2;

  if(myDepth<GOAL_DANGER){                   // being backed into my own goal — get out
    let ex=0;
    if(Math.abs(p.x-ARENA.cx)<mouth+p.r)ex=p.x<ARENA.cx?-1:1;   // slide out of the mouth
    p.input.dx=ex*1.15;
    p.input.dy=p.team?-1:1;                  // and upfield
    p.input.dash=p.dashCd<=0&&p.stamina>0.32&&myDepth<GOAL_DANGER*0.55;
    return;
  }

  // stand between the opponent and midfield, squared up with their goal
  const targetX=o.x+(ARENA.cx-o.x)*0.35;
  const targetY=o.y-pushDir*(p.r*1.75);
  let ax=targetX-p.x, ay=targetY-p.y;
  const d=hypot(ax,ay)||1; ax/=d; ay/=d;
  ax+=(m.rng()-0.5)*0.3; ay+=(m.rng()-0.5)*0.3;
  p.input.dx=ax; p.input.dy=ay;

  const goalSide=(o.y-p.y)*pushDir>0;        // am I on the right side to push them back?
  const near=hypot(o.x-p.x,o.y-p.y)<190;
  const linedUp=Math.abs(o.x-ARENA.cx)<mouth+p.r*1.5;
  p.input.dash=p.dashCd<=0&&p.stamina>0.34&&goalSide&&near
               &&m.rng()<0.08*p.aggression*p.skill*(linedUp?1.7:0.7)*(foeDepth<300?1.5:1);
}

function applyControl(p,o,m){
  if(p.stun>0){p.input.dx=0;p.input.dy=0;p.input.dash=false;return}
  // An unattended flag is a sitting duck, so idle frames fall back to AI steering.
  // `given` is raised by the input layer only, so any real input overrides this at once.
  if(!p.human||!p.input.given)aiThink(p,o,m);

  const len=hypot(p.input.dx,p.input.dy);
  if(len>0.0001){
    const accel=THRUST*p.skill*(0.55+0.45*p.stamina);
    p.vx+=(p.input.dx/len)*accel;
    p.vy+=(p.input.dy/len)*accel;
  }
  if(p.input.dash&&p.dashCd<=0&&p.stamina>0.28){
    const dl=len>0.0001?len:1;
    const dx=len>0.0001?p.input.dx/dl:0, dy=len>0.0001?p.input.dy/dl:(p.team?-1:1);
    p.vx+=dx*DASH_IMPULSE*p.power; p.vy+=dy*DASH_IMPULSE*p.power;
    p.dashCd=0.8; p.dashing=0.26; p.stamina-=0.3;
    m.events.push({type:'dash',x:p.x,y:p.y,team:p.team});
  }
  p.input.dash=false; p.input.given=false;
}

function integrate(p){
  p.vx*=DRAG; p.vy*=DRAG;
  const sp=hypot(p.vx,p.vy);
  const cap=p.launch>0?LAUNCH_CAP:p.dashing>0?DASH_CAP:THRUST_CAP;
  if(sp>cap){p.vx=p.vx/sp*cap; p.vy=p.vy/sp*cap}
  p.x+=p.vx; p.y+=p.vy;
}

/* Touchlines and the goal-line woodwork bounce you back. The only way off the pitch
   is through the mouth of the goal you are defending. */
function walls(p,m){
  if(p.x<MARGIN+p.r){p.x=MARGIN+p.r;p.vx=Math.abs(p.vx)*WALL_BOUNCE}
  if(p.x>ARENA.w-MARGIN-p.r){p.x=ARENA.w-MARGIN-p.r;p.vx=-Math.abs(p.vx)*WALL_BOUNCE}
  const inMouth=Math.abs(p.x-ARENA.cx)<m.goalW/2;
  const ownTop=p.team===0;
  if(p.y<MARGIN+p.r&&!(ownTop&&inMouth)){p.y=MARGIN+p.r;p.vy=Math.abs(p.vy)*WALL_BOUNCE}
  if(p.y>ARENA.h-MARGIN-p.r&&!(!ownTop&&inMouth)){p.y=ARENA.h-MARGIN-p.r;p.vy=-Math.abs(p.vy)*WALL_BOUNCE}
}

/* Smash-style knockback: the more damage you already carry, the further each hit throws
   you. That escalation is what eventually puts somebody in their own net. */
function resolveCollision(m){
  const a=m.a,b=m.b;
  const dx=b.x-a.x, dy=b.y-a.y, d=hypot(dx,dy)||1, min=a.r+b.r;
  if(d>=min)return;
  const nx=dx/d, ny=dy/d, over=min-d;
  a.x-=nx*over/2; a.y-=ny*over/2;
  b.x+=nx*over/2; b.y+=ny*over/2;

  const rvx=b.vx-a.vx, rvy=b.vy-a.vy, closing=rvx*nx+rvy*ny;
  if(closing>=0)return;

  const speed=-closing;
  const scale=0.62+(m.impact/100)*1.05;
  const base=speed*0.34*scale;
  const dashA=a.dashing>0?1.6:1, dashB=b.dashing>0?1.6:1;
  const kbA=(0.35+a.damage*2.4)*dashB*b.power;
  const kbB=(0.35+b.damage*2.4)*dashA*a.power;

  a.vx-=nx*base*kbA; a.vy-=ny*base*kbA;
  b.vx+=nx*base*kbB; b.vy+=ny*base*kbB;
  if(base*kbA>4.5)a.launch=0.5;
  if(base*kbB>4.5)b.launch=0.5;

  const tx=-ny, ty=nx, tangent=(rvx*tx+rvy*ty)*0.09;
  a.vx-=tx*tangent; a.vy-=ty*tangent;
  b.vx+=tx*tangent; b.vy+=ty*tangent;

  if(a.hitCd<=0&&b.hitCd<=0&&speed>0.9){
    a.hitCd=b.hitCd=0.14;
    const dmg=Math.min(0.10,0.012+speed*0.008);
    a.damage=Math.min(1,a.damage+dmg*dashB);
    b.damage=Math.min(1,b.damage+dmg*dashA);
    a.stamina=Math.max(0,a.stamina-0.05);
    b.stamina=Math.max(0,b.stamina-0.05);
    const aggressor=dashA>dashB?a:dashB>dashA?b:(hypot(a.vx,a.vy)>hypot(b.vx,b.vy)?a:b);
    if(speed>2.2){a.stun=Math.min(0.35,speed*0.03);b.stun=Math.min(0.35,speed*0.03)}
    m.hits++;
    m.events.push({type:'hit',x:(a.x+b.x)/2,y:(a.y+b.y)/2,power:speed,
      aggressor:aggressor.flag,victim:(aggressor===a?b:a).flag});
  }
}

function finish(m,winner,loser,reason){
  m.over=true; m.winner=winner; m.loser=loser; m.reason=reason;
  m.events.push({type:'end',winner:winner.flag,loser:loser.flag,reason,x:loser.x,y:loser.y});
}

const inOwnNet=(p,m)=>Math.abs(p.x-ARENA.cx)<m.goalW/2 &&
  (p.team===0?p.y<MARGIN:p.y>ARENA.h-MARGIN);

function checkGoals(m){
  const aIn=inOwnNet(m.a,m), bIn=inOwnNet(m.b,m);
  if(aIn&&bIn){
    const da=MARGIN-m.a.y, db=m.b.y-(ARENA.h-MARGIN);
    da>=db?finish(m,m.b,m.a,'goal'):finish(m,m.a,m.b,'goal');
    return;
  }
  if(aIn){m.a.conceded=true;finish(m,m.b,m.a,'goal');return}
  if(bIn){m.b.conceded=true;finish(m,m.a,m.b,'goal')}
}

function stepMatch(m){
  if(m.over||!m.started)return m.events;
  m.time+=DT;
  if(m.time>SUDDEN_DEATH){
    if(!m.suddenAnnounced){m.suddenAnnounced=true;m.events.push({type:'sudden'})}
    m.goalW=Math.min(GOAL_W_MAX,m.goalW+GOAL_GROW*DT);
  }
  tickFighter(m.a); tickFighter(m.b);
  applyControl(m.a,m.b,m); applyControl(m.b,m.a,m);
  integrate(m.a); integrate(m.b);
  resolveCollision(m);
  walls(m.a,m); walls(m.b,m);
  checkGoals(m);
  if(!m.over&&m.time>=HARD_CAP){
    const winner=m.a.damage<=m.b.damage?m.a:m.b;
    finish(m,winner,winner===m.a?m.b:m.a,'decision');
  }
  return m.events;
}

function simulateMatch(m){
  m.started=true;
  let guard=0;
  while(!m.over&&guard++<60*120){m.events.length=0;stepMatch(m)}
  if(!m.over){
    const winner=m.a.damage<=m.b.damage?m.a:m.b;
    finish(m,winner,winner===m.a?m.b:m.a,'decision');
  }
  return m.winner;
}

/* ---- bracket ---- */
function createCup(flags,rng){
  const pool=shuffle(flags,rng).slice(0,64);
  return {round:0,queue:pool.slice(),winners:[],champion:null,played:0,total:pool.length-1,size:pool.length};
}
const cupRemaining=cup=>cup.queue.length+cup.winners.length;

function nextPair(cup){
  for(let guard=0;guard<64;guard++){
    if(cup.queue.length>=2)return [cup.queue.shift(),cup.queue.shift()];
    if(cup.queue.length===1){cup.winners.push(cup.queue.shift());continue}  // bye, never dropped
    if(cup.winners.length===1){cup.champion=cup.winners[0];return null}
    if(cup.winners.length===0)return null;
    cup.queue=cup.winners; cup.winners=[]; cup.round++;
  }
  return null;
}
function reportWinner(cup,flag){cup.winners.push(flag);cup.played++}
/* ==SIM-CORE-END== */

/* ---- flag art ---- */
const imgCache={};
function flagImg(code){
  if(!imgCache[code]){
    const im=new Image();
    im.decoding='async';
    im.src='https://flagcdn.com/w160/'+code+'.png';
    imgCache[code]=im;
  }
  return imgCache[code];
}
function codeColor(code){
  let h=0; for(let i=0;i<code.length;i++)h=(h*31+code.charCodeAt(i))%360;
  return 'hsl('+h+' 62% 42%)';
}

}

function renderFlagGrid(filter){

$('search').addEventListener('input',e=>renderFlagGrid(e.target.value));
function setMode(next){

}
$('modePlay').onclick=()=>setMode('play');
$('modeWatch').onclick=()=>setMode('watch');

/* ---- tournament flow ---- */
function startCup(){
  cup=createCup(FLAGS,Math.random);
  if(mode==='play'&&myFlag&&!cup.queue.some(f=>f[1]===myFlag[1])){
    cup.queue[Math.floor(Math.random()*cup.queue.length)]=myFlag;
  }
  feedLines=[]; $('feed').innerHTML='';
  AudioFX.init(); AudioFX.resume(); AudioFX.setCrowd(0); AudioFX.setIntensity(0.2);
  showScreen('scrGame');
  log('🏟️ The cup begins — 64 flags, one pitch.');
  nextMatch();
}

function humanTeamFor(a,b){
  if(mode!=='play'||!myFlag)return -1;
  if(a[1]===myFlag[1])return 0;
  if(b[1]===myFlag[1])return 1;
  return -1;
}

function nextMatch(){
  AudioFX.shutUp();
  const pair=nextPair(cup);
  if(!pair){ cup.champion?showChampion(cup.champion):showScreen('scrMenu'); return }
  const [fa,fb]=pair;
  match=createMatch(fa,fb,(Math.random()*2**32)>>>0,
    {impact:impactSetting,humanTeam:humanTeamFor(fa,fb)});
  playing=false; particles=[]; waves=[]; shake=0;
  const mine=humanTeamFor(fa,fb);
  say('⚔️ <strong>'+fa[0]+'</strong> vs <strong>'+fb[0]+'</strong>'+
      (mine>=0?' — this one is yours':''));
  $('fight').textContent='⚡ FIGHT';
  refreshHud(); syncControls(); scheduleFit();
  if(auto)setTimeout(()=>{if(auto&&match&&!match.over)beginFight()},450/speed);
}

function beginFight(){
  if(!match||match.over)return;
  match.started=true; playing=true;
  $('fight').textContent='⏸ PAUSE';
  log('⚔️ '+match.a.flag[0]+' vs '+match.b.flag[0]);
  say('⚡ FIGHT!');
  AudioFX.init(); AudioFX.resume(); AudioFX.whistle(false); AudioFX.startMusic();
  AudioFX.setIntensity(cup?cup.round/5*0.6:0.2);
  const mine=match.a.human||match.b.human;
  AudioFX.speak(pick([
    match.a.flag[0]+' against '+match.b.flag[0]+'. Kick off!',
    'Here we go — '+match.a.flag[0]+' versus '+match.b.flag[0]+'.',
    'Underway in the '+ROUNDS[Math.min(cup?cup.round:0,5)]+'. '+match.a.flag[0]+' and '+match.b.flag[0]+'.'
  ])+(mine?' This one is yours.':''),1);
  syncControls();
}

function endMatch(){
  const w=match.winner.flag, l=match.loser.flag;
  playing=false;
  reportWinner(cup,w);
  const scored=match.reason==='goal';
  log((scored?'⚽ ':'⏱️ ')+w[0]+(scored?' bundles '+l[0]+' into their own net':' wins on damage vs '+l[0]));
  say('🏆 <strong>'+w[0]+'</strong> '+(scored?'puts '+l[0]+' in their own net!':'takes it on damage.'));
  AudioFX.speak(scored
    ? pick(['Goal! '+w[0]+' bundles '+l[0]+' into their own net!',
            'Oh, that is brutal! '+l[0]+' goes in at their own end. '+w[0]+' advance.',
            'In the net! '+w[0]+' knock out '+l[0]+'.'])
    : w[0]+' takes it on damage. '+l[0]+' are out.',2);
  $('fight').textContent='➡ NEXT';
  refreshHud(); syncControls();
  const delay=(auto?900:1500)/speed;
  pendingAdvance=setTimeout(()=>{pendingAdvance=null;nextMatch()},delay);
}

function simRest(){
  if(!cup)return;
  AudioFX.shutUp(); AudioFX.stopMusic();
  if(pendingAdvance){clearTimeout(pendingAdvance);pendingAdvance=null}
  if(match&&!match.over){
    match.started=true; simulateMatch(match); reportWinner(cup,match.winner.flag);
  }
  let guard=0;
  while(!cup.champion&&guard++<200){
    const pair=nextPair(cup);
    if(!pair)break;
    const m=createMatch(pair[0],pair[1],(Math.random()*2**32)>>>0,{impact:impactSetting});
    simulateMatch(m);
    reportWinner(cup,m.winner.flag);
  }
  match=null; playing=false; auto=false;
  log('⏩ Remaining matches simulated.');
  cup.champion?showChampion(cup.champion):nextMatch();
}

function showChampion(flag){
  playing=false; match=null; auto=false;
  AudioFX.stopMusic(); AudioFX.fanfare();
  AudioFX.speak(flag[0]+' are champions of the world! '+flag[0]+' win the World Cup of Flags!',2);
  $('champName').textContent=flag[0];
  $('champFlag').src='https://flagcdn.com/w160/'+flag[1]+'.png';
  $('champFlag').alt=flag[0]+' flag';
  showScreen('scrChamp');
}

/* ---- HUD ---- */
let hudCache='';
function refreshHud(){
  if(!cup)return;
  const remaining=cupRemaining(cup)+(match&&!match.over?2:0);
  $('roundName').textContent=ROUNDS[Math.min(cup.round,5)];
  $('matchCount').textContent=cup.champion?'Complete':Math.max(1,Math.ceil(remaining/2))+' battles left';
  $('progress').style.width=(cup.played/cup.total*100).toFixed(1)+'%';
  $('rounds').innerHTML=ROUND_TAGS.map((t,i)=>
    '<div class="round '+(i<cup.round?'done':i===cup.round?'active':'')+'">'+t+'</div>').join('');

  if(match){
    const mine=mode==='play'&&myFlag;
    const tagA=mine&&match.a.human?'<span class="you">YOU</span>':'';
    const tagB=mine&&match.b.human?'<span class="you">YOU</span>':'';
    const key=match.a.flag[1]+match.b.flag[1]+tagA+tagB;
    if(key!==hudCache){
      hudCache=key;
      $('nameA').innerHTML=match.a.flag[0]+tagA;
      $('nameB').innerHTML=tagB+match.b.flag[0];
    }
    syncHint();
    const tension=Math.max(match.a.damage,match.b.damage);
    AudioFX.setCrowd(tension);
    AudioFX.setIntensity(Math.min(1,(cup.round/5)*0.5+tension*0.5));
    $('dmgA').textContent=Math.round(match.a.damage*100)+'%';
    $('dmgB').textContent=Math.round(match.b.damage*100)+'%';
  }
}

function syncHint(){
  if(arenaScale<0.45){$('hint').style.display='none';return}
  const humanInMatch=!!(match&&(match.a.human||match.b.human));
  const early=!match||match.time<4;
  $('hint').textContent=humanInMatch
    ? (playing?(early?'Drag to steer • SPACE or SLAM to charge':''):'Your match — hit FIGHT')
    : (playing?'':'Spectating');
  $('hint').style.display=$('hint').textContent?'block':'none';
}

function syncControls(){
  const humanInMatch=!!(match&&(match.a.human||match.b.human));
  $('slam').disabled=!(humanInMatch&&playing);
  $('auto').textContent=auto?'⏸ AUTO':'▶ AUTO';
  $('simRest').disabled=!cup||!!cup.champion;
  const early=!match||match.time<4;
  $('hint').textContent=humanInMatch
    ? (playing?(early?'Drag to steer • SPACE or SLAM to charge':''):'Your match — hit FIGHT')
    : (playing?'':'Spectating');
  $('hint').style.display=$('hint').textContent?'block':'none';
}

/* ---- input ---- */
const keys=new Set();
const pointer={x:0,y:0,active:false};
let slamQueued=false;

function canvasPoint(e){
  const rect=cv.getBoundingClientRect();
  return {x:(e.clientX-rect.left)/rect.width*ARENA.w, y:(e.clientY-rect.top)/rect.height*ARENA.h};
}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  const p=canvasPoint(e); pointer.x=p.x; pointer.y=p.y; pointer.active=true;
  e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
  if(!pointer.active)return;
  const p=canvasPoint(e); pointer.x=p.x; pointer.y=p.y;
});
for(const ev of ['pointerup','pointercancel','pointerleave'])
  cv.addEventListener(ev,()=>{pointer.active=false});

addEventListener('keydown',e=>{
  if(e.key===' '||e.code==='Space'){
    if($('scrGame').classList.contains('show')){slamQueued=true;e.preventDefault()}
    return;
  }
  if(e.key==='Enter'&&$('scrGame').classList.contains('show')){$('fight').click();e.preventDefault();return}
  keys.add(e.key.length===1?e.key.toLowerCase():e.key);
});
addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));
addEventListener('blur',()=>keys.clear());

function feedHumanInput(p){
  let dx=0,dy=0;
  if(keys.has('ArrowUp')||keys.has('w'))dy-=1;
  if(keys.has('ArrowDown')||keys.has('s'))dy+=1;
  if(keys.has('ArrowLeft')||keys.has('a'))dx-=1;
  if(keys.has('ArrowRight')||keys.has('d'))dx+=1;
  if(!dx&&!dy&&pointer.active){
    const tx=pointer.x-p.x, ty=pointer.y-p.y;
    if(hypot(tx,ty)>10){dx=tx;dy=ty}
  }
  p.input.dx=dx; p.input.dy=dy;
  if(slamQueued)p.input.dash=true;
  p.input.given=!!(dx||dy||slamQueued);
}

/* ---- effects ---- */
function burst(x,y,count,power){
  if(reduceMotion)count=Math.min(count,8);
  for(let i=0;i<count;i++){
    const ang=Math.random()*Math.PI*2, sp=(1.5+Math.random()*4)*(0.6+power*0.25);
    particles.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,
      life:0.35+Math.random()*0.45,max:0.8,size:1.5+Math.random()*3.5});
  }
  if(particles.length>420)particles.splice(0,particles.length-420);
}

function pushWave(x,y,max,life){
  waves.push({x,y,r:14,max,life});
  if(waves.length>24)waves.splice(0,waves.length-24);
}

function consumeEvents(){
  for(const ev of match.events){
    if(ev.type==='hit'){
      burst(ev.x,ev.y,Math.min(60,16+ev.power*5),ev.power);
      pushWave(ev.x,ev.y,50+ev.power*14,0.45);
      if(!reduceMotion)shake=Math.min(16,shake+ev.power*1.6);
      AudioFX.hit(ev.power);
      if(ev.power>4.2){
        log('💥 '+ev.aggressor[0]+' slams '+ev.victim[0]+' — '+ev.power.toFixed(1)+' impact');
        if(ev.power>5.4)AudioFX.speak(pick([
          'Huge hit from '+ev.aggressor[0]+'!',
          ev.aggressor[0]+' absolutely flattens '+ev.victim[0]+'!',
          'What a challenge by '+ev.aggressor[0]+'!']),0);
      }
    }else if(ev.type==='dash'){
      burst(ev.x,ev.y,10,1);
      AudioFX.dash();
    }else if(ev.type==='sudden'){
      log('🔥 Sudden death — the goals are stretching wide!');
      say('🔥 <strong>SUDDEN DEATH</strong> — the goals are widening');
      AudioFX.siren(); AudioFX.setIntensity(1);
      AudioFX.speak('Sudden death! The goals are opening up!',2);
    }else if(ev.type==='end'){
      burst(ev.x,ev.y,reduceMotion?10:70,6);
      pushWave(ev.x,ev.y,150,0.7);
      if(!reduceMotion)shake=18;
      ev.reason==='goal'?AudioFX.goalHorn():AudioFX.whistle(true);
    }
  }
  match.events.length=0;
}

/* ---- simulation tick ---- */
function tick(){
  if(!match||!playing||match.over)return;
  if(match.a.human)feedHumanInput(match.a);
  if(match.b.human)feedHumanInput(match.b);
  match.impact=impactSetting;
  stepMatch(match);
  slamQueued=false;
  consumeEvents();
  if(match.over)endMatch();
}

/* ---- render ---- */
function drawFighter(p,m){
  const teetering=ownDepth(p)<GOAL_DANGER*0.7&&Math.abs(p.x-ARENA.cx)<m.goalW/2+p.r;
  const color=p.team?'#fb5c7d':'#38bdf8';

  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.shadowColor=color; ctx.shadowBlur=teetering?34:22;
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.arc(0,0,p.r+6,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;

  ctx.save();
  ctx.rotate(p.spin*0.35);
  ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.clip();
  const im=flagImg(p.flag[1]);
  if(im.complete&&im.naturalWidth){
    ctx.drawImage(im,-p.r,-p.r*0.68,p.r*2,p.r*1.36);
  }else{
    ctx.fillStyle=codeColor(p.flag[1]);
    ctx.fillRect(-p.r,-p.r,p.r*2,p.r*2);
    ctx.fillStyle='#fff'; ctx.font='900 20px system-ui'; ctx.textAlign='center';
    ctx.fillText(p.flag[1].slice(0,3).toUpperCase(),0,7);
  }
  ctx.restore();

  // damage ring: fills clockwise as the flag gets easier to launch
  ctx.strokeStyle='#ffffff33'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.arc(0,0,p.r+5,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle=p.damage>0.66?'#ff5252':p.damage>0.33?'#ffb020':'#7bed9f';
  ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0,0,p.r+5,-Math.PI/2,-Math.PI/2+p.damage*Math.PI*2); ctx.stroke();

  if(p.dashing>0){
    ctx.strokeStyle='#ffd84a'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,0,p.r+13,0,Math.PI*2); ctx.stroke();
  }
  if(p.human){
    ctx.fillStyle='#f5c451'; ctx.font='900 18px system-ui'; ctx.textAlign='center';
    ctx.lineWidth=4; ctx.strokeStyle='#04240fcc';
    ctx.strokeText('▼ YOU',0,-p.r-14); ctx.fillText('▼ YOU',0,-p.r-14);
  }
  ctx.restore();

  ctx.font='800 12px system-ui'; ctx.textAlign='center';
  ctx.lineWidth=3; ctx.strokeStyle='#04101cd9';
  ctx.strokeText(p.flag[0],p.x,p.y+p.r+22);
  ctx.fillStyle='#e8f1ff';
  ctx.fillText(p.flag[0],p.x,p.y+p.r+22);
}

function drawPitch(goalW){
  const W=ARENA.w, H=ARENA.h;

  ctx.fillStyle='#0a6b2e'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<12;i++){                                  // mown stripes
    if(i%2){ctx.fillStyle='#0c7a34'; ctx.fillRect(0,i*H/12,W,H/12)}
  }

  ctx.strokeStyle='#ffffffcc'; ctx.lineWidth=3;
  ctx.strokeRect(MARGIN,MARGIN,W-MARGIN*2,H-MARGIN*2);
  ctx.beginPath(); ctx.moveTo(MARGIN,H/2); ctx.lineTo(W-MARGIN,H/2); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2,H/2,63,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='#ffffffcc';
  ctx.beginPath(); ctx.arc(W/2,H/2,4,0,Math.PI*2); ctx.fill();

  ctx.strokeRect(W/2-75,MARGIN,150,180);                  // penalty areas
  ctx.strokeRect(W/2-75,H-198,150,180);
  ctx.strokeRect(W/2-GOAL_W/2,MARGIN,GOAL_W,65);          // six-yard boxes
  ctx.strokeRect(W/2-GOAL_W/2,H-83,GOAL_W,65);
  ctx.beginPath(); ctx.arc(W/2,198,55,0,Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2,H-198,55,Math.PI,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2,150,4,0,Math.PI*2); ctx.fill();      // penalty spots
  ctx.beginPath(); ctx.arc(W/2,H-150,4,0,Math.PI*2); ctx.fill();

  // The live goal mouths — these are the kill zones, and they widen in sudden death.
  const half=goalW/2;
  for(const top of [true,false]){
    const y=top?0:H-MARGIN, colour=top?'#38bdf8':'#fb5c7d';
    ctx.fillStyle=colour+'44';
    ctx.fillRect(W/2-half,y,goalW,MARGIN);
    ctx.strokeStyle=colour; ctx.lineWidth=4;
    ctx.shadowColor=colour; ctx.shadowBlur=14;
    ctx.beginPath();
    ctx.moveTo(W/2-half,top?MARGIN:H-MARGIN);
    ctx.lineTo(W/2-half,top?0:H);
    ctx.moveTo(W/2+half,top?MARGIN:H-MARGIN);
    ctx.lineTo(W/2+half,top?0:H);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(W/2-half,top?MARGIN:H-MARGIN);
    ctx.lineTo(W/2+half,top?MARGIN:H-MARGIN);
    ctx.stroke();
    ctx.shadowBlur=0;
    ctx.strokeStyle=colour+'55'; ctx.lineWidth=1;         // netting
    for(let x=W/2-half;x<=W/2+half;x+=11){
      ctx.beginPath(); ctx.moveTo(x,top?0:H-MARGIN); ctx.lineTo(x,top?MARGIN:H); ctx.stroke();
    }
  }
}

function drawFighter(p,m){
  const teetering=ownDepth(p)<GOAL_DANGER*0.7&&Math.abs(p.x-ARENA.cx)<m.goalW/2+p.r;
  const color=p.team?'#fb5c7d':'#38bdf8';

  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.shadowColor=teetering?'#ffd84a':color; ctx.shadowBlur=teetering?34:22;
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.arc(0,0,p.r+6,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;

  ctx.save();
  ctx.rotate(p.spin*0.35);
  ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.clip();
  const im=flagImg(p.flag[1]);
  if(im.complete&&im.naturalWidth){
    ctx.drawImage(im,-p.r,-p.r*0.68,p.r*2,p.r*1.36);
  }else{
    ctx.fillStyle=codeColor(p.flag[1]);
    ctx.fillRect(-p.r,-p.r,p.r*2,p.r*2);
    ctx.fillStyle='#fff'; ctx.font='900 15px system-ui'; ctx.textAlign='center';
    ctx.fillText(p.flag[1].slice(0,3).toUpperCase(),0,5);
  }
  ctx.restore();

  // damage ring: fills clockwise as the flag gets easier to launch
  ctx.strokeStyle='#00000055'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.arc(0,0,p.r+5,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle=p.damage>0.66?'#ff5252':p.damage>0.33?'#ffb020':'#7bed9f';
  ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0,0,p.r+5,-Math.PI/2,-Math.PI/2+p.damage*Math.PI*2); ctx.stroke();

  if(p.dashing>0){
    ctx.strokeStyle='#ffd84a'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,0,p.r+13,0,Math.PI*2); ctx.stroke();
  }
  if(p.human){
    ctx.fillStyle='#f5c451'; ctx.font='900 11px system-ui'; ctx.textAlign='center';
    ctx.fillText('▼ YOU',0,-p.r-16);
  }
  ctx.restore();

  // which end this flag is defending — the thing that kills it
  if(arenaScale<0.45)return;
  const clampY=v=>Math.max(34,Math.min(ARENA.h-10,v));
  const arrowY=clampY(p.team?p.y+p.r+46:p.y-p.r-40);
  ctx.font='900 15px system-ui'; ctx.textAlign='center';
  ctx.lineWidth=4; ctx.strokeStyle='#04240fcc';
  ctx.strokeText(p.team?'▼ own net':'▲ own net',p.x,arrowY);
  ctx.fillStyle=teetering?'#ffd84a':'#ffffffaa';
  ctx.fillText(p.team?'▼ own net':'▲ own net',p.x,arrowY);

  ctx.font='800 20px system-ui'; ctx.textAlign='center';
  ctx.lineWidth=5; ctx.strokeStyle='#04240fcc';
  const nameY=clampY(p.y+p.r+24);
  ctx.strokeText(p.flag[0],p.x,nameY);
  ctx.fillStyle='#ffffff';
  ctx.fillText(p.flag[0],p.x,nameY);
}

function draw(){
  ctx.clearRect(0,0,ARENA.w,ARENA.h);
  ctx.save();
  if(shake>0.15){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=0.85}
  else shake=0;

  drawPitch(match?match.goalW:GOAL_W);

  for(const s of waves){
    s.r+=(s.max-s.r)*0.22; s.life-=DT;
    ctx.strokeStyle='rgba(255,255,255,'+Math.max(0,s.life*1.7)+')';
    ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.stroke();
  }
  waves=waves.filter(s=>s.life>0);

  for(const p of particles){
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.94; p.vy*=0.94; p.life-=DT;
    ctx.fillStyle='rgba(255,240,180,'+Math.max(0,p.life/p.max)+')';
    ctx.fillRect(p.x,p.y,p.size,p.size);
  }
  particles=particles.filter(p=>p.life>0);

  if(match){drawFighter(match.a,match);drawFighter(match.b,match)}
  ctx.restore();
}

/* Size the pitch from what is actually left on screen. A fixed viewport-unit
   subtraction cannot know the chrome height and went negative on landscape phones. */
const ARENA_MIN_H=250, ARENA_MIN_H_LAND=150, ARENA_MAX_H=ARENA.h;
let arenaScale=1;   // displayed CSS px per canvas unit; drives label legibility
const LANDSCAPE='(orientation:landscape) and (max-height:560px)';
function fitArena(){
  const game=$('scrGame');
  if(!game.classList.contains('show'))return;
  const box=$('box'), wide=matchMedia(LANDSCAPE).matches;
  box.style.maxWidth='0px';                       // collapse, then measure everything else
  game.style.height='';
  let avail, widthCap;
  if(wide){
    // two columns: the pitch gets the full height below the header
    const top=box.getBoundingClientRect().top;
    const appPadBottom=parseFloat(getComputedStyle(document.querySelector('.app')).paddingBottom)||0;
    avail=innerHeight-top-appPadBottom-6;
    game.style.height=Math.max(0,avail)+'px';     // lets the right column scroll, not the page
    widthCap=game.getBoundingClientRect().width*0.45;
  }else{
    avail=innerHeight-12-($('slam').getBoundingClientRect().bottom+scrollY);
    widthCap=game.getBoundingClientRect().width;
  }
  const h=Math.max(wide?ARENA_MIN_H_LAND:ARENA_MIN_H,Math.min(ARENA_MAX_H,avail));
  box.style.maxWidth=Math.min(widthCap,h*ARENA.w/ARENA.h)+'px';
  arenaScale=$('arena').getBoundingClientRect().width/ARENA.w;
  syncHint();
}
// measure only once layout has settled, otherwise the HUD is still empty and we
// under-size the pitch
const scheduleFit=()=>requestAnimationFrame(()=>requestAnimationFrame(fitArena));
addEventListener('resize',scheduleFit);
addEventListener('orientationchange',()=>setTimeout(scheduleFit,150));

/* ---- main loop ---- */
function frame(now){
  if(!lastFrame)lastFrame=now;
  const dt=Math.min(0.05,(now-lastFrame)/1000)*speed;
  lastFrame=now;
  accumulator+=dt;
  let steps=0;
  while(accumulator>=DT&&steps++<6){tick();accumulator-=DT}
  if(accumulator>DT*6)accumulator=0;
  draw();
  if(match&&playing)refreshHud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){lastFrame=0;accumulator=0;AudioFX.stopMusic();AudioFX.shutUp()}
  else if(playing)AudioFX.startMusic();
});


/* ================= AUDIO =================
   Everything is synthesised — the repo ships as one file with no assets, so there is
   nothing to fetch. Web Audio builds the crowd bed, the loop and the effects; Web
   Speech reads the commentary. Kept entirely out of SIM-CORE so the sim stays pure. */
const AudioFX=(()=>{
  let ctx=null,master=null,musicBus=null,crowdBus=null,sfxBus=null;
  let noise=null,crowdGain=null,crowdBase=0.05;
  let seqTimer=null,step=0,nextStepAt=0,intensity=0,running=false;
  let on=true,voiceOn=true,ducked=false;
  const BPM=126, STEP=60/BPM/4;                       // sixteenth notes
  const ROOT=55;                                      // A1
  const SEMI=n=>ROOT*Math.pow(2,n/12);
  const BASS=[0,0,12,0, 7,0,3,0];                     // A minor riff, one note per eighth
  const ARP=[24,31,36,31, 27,34,39,34];

  try{
    on=localStorage.getItem('wcf.sfx')!=='0';
    voiceOn=localStorage.getItem('wcf.voice')!=='0';
  }catch(e){}

  function makeNoise(seconds){
    const len=Math.floor(ctx.sampleRate*seconds);
    const buf=ctx.createBuffer(1,len,ctx.sampleRate);
    const d=buf.getChannelData(0);
    let last=0;
    for(let i=0;i<len;i++){
      const white=Math.random()*2-1;
      last=(last+0.02*white)/1.02;                    // brown noise reads as a crowd, not static
      d[i]=Math.max(-1,Math.min(1,last*3.2));
    }
    return buf;
  }

  function init(){
    if(ctx)return true;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return false;
    try{ctx=new AC()}catch(e){return false}
    master=ctx.createGain(); master.gain.value=on?0.9:0; master.connect(ctx.destination);
    musicBus=ctx.createGain(); musicBus.gain.value=0.34; musicBus.connect(master);
    crowdBus=ctx.createGain(); crowdBus.gain.value=0.7;  crowdBus.connect(master);
    sfxBus=ctx.createGain();   sfxBus.gain.value=0.85;   sfxBus.connect(master);
    noise=makeNoise(4);

    // crowd bed: looped brown noise through a bandpass, with a slow murmur LFO
    const src=ctx.createBufferSource(); src.buffer=noise; src.loop=true;
    const band=ctx.createBiquadFilter(); band.type='bandpass'; band.frequency.value=650; band.Q.value=0.55;
    crowdGain=ctx.createGain(); crowdGain.gain.value=crowdBase;
    const lfo=ctx.createOscillator(); lfo.frequency.value=0.13;
    const lfoAmt=ctx.createGain(); lfoAmt.gain.value=0.018;
    lfo.connect(lfoAmt).connect(crowdGain.gain);
    src.connect(band).connect(crowdGain).connect(crowdBus);
    src.start(); lfo.start();
    return true;
  }

  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  const ready=()=>on&&(ctx||init())&&(resume(),true);

  /* ---- instruments ---- */
  function kick(t){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.frequency.setValueAtTime(145,t); o.frequency.exponentialRampToValueAtTime(45,t+0.11);
    g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.22);
    o.connect(g).connect(musicBus); o.start(t); o.stop(t+0.24);
  }
  function hat(t,v){
    const s=ctx.createBufferSource(); s.buffer=noise;
    s.playbackRate.value=1.6;
    const f=ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=7200;
    const g=ctx.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.045);
    s.connect(f).connect(g).connect(musicBus); s.start(t); s.stop(t+0.06);
  }
  function bass(t,freq){
    const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();
    o.type='sawtooth'; o.frequency.value=freq;
    f.type='lowpass'; f.frequency.setValueAtTime(340+400*intensity,t);
    f.frequency.exponentialRampToValueAtTime(130,t+0.2);
    g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.24);
    o.connect(f).connect(g).connect(musicBus); o.start(t); o.stop(t+0.26);
  }
  function arp(t,freq,v){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='square'; o.frequency.value=freq;
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
    o.connect(g).connect(musicBus); o.start(t); o.stop(t+0.17);
  }

  function playStep(s,t){
    if(s%4===0)kick(t);
    hat(t,s%4===2?0.22:0.09);
    if(s%2===0)bass(t,SEMI(BASS[(s/2)%8]));
    if(intensity>0.35&&s%2===1)arp(t,SEMI(ARP[((s-1)/2)%8]),0.05+0.05*intensity);
    if(intensity>0.75&&s%8===6)arp(t,SEMI(ARP[(s/2)%8]+12),0.045);
  }
  function scheduler(){
    if(!ctx)return;
    while(nextStepAt<ctx.currentTime+0.12){
      playStep(step,Math.max(nextStepAt,ctx.currentTime));
      nextStepAt+=STEP; step=(step+1)%32;
    }
  }

  /* ---- public ---- */
  function startMusic(){
    if(!ready()||running)return;
    running=true; step=0; nextStepAt=ctx.currentTime+0.05;
    seqTimer=setInterval(scheduler,25);
  }
  function stopMusic(){
    running=false;
    if(seqTimer){clearInterval(seqTimer);seqTimer=null}
  }
  function setIntensity(x){ intensity=Math.max(0,Math.min(1,x)); }
  function setCrowd(x){
    if(!ctx||!crowdGain)return;
    crowdBase=0.035+0.075*Math.max(0,Math.min(1,x));
    crowdGain.gain.setTargetAtTime(crowdBase,ctx.currentTime,0.6);
  }
  function roar(peak,len){
    if(!ctx||!crowdGain)return;
    const t=ctx.currentTime;
    crowdGain.gain.cancelScheduledValues(t);
    crowdGain.gain.setValueAtTime(crowdGain.gain.value,t);
    crowdGain.gain.linearRampToValueAtTime(0.10+0.5*peak,t+0.12);
    crowdGain.gain.setTargetAtTime(crowdBase,t+0.3,len*0.4);
  }

  function whistle(long){
    if(!ready())return;
    const t=ctx.currentTime, dur=long?0.75:0.34;
    const o=ctx.createOscillator(),g=ctx.createGain();
    const lfo=ctx.createOscillator(),lg=ctx.createGain();
    o.type='sine'; o.frequency.value=3150;
    lfo.frequency.value=24; lg.gain.value=190;
    lfo.connect(lg).connect(o.frequency);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.3,t+0.02);
    g.gain.setValueAtTime(0.3,t+dur);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.1);
    o.connect(g).connect(sfxBus);
    o.start(t); lfo.start(t); o.stop(t+dur+0.14); lfo.stop(t+dur+0.14);
  }
  function hit(power){
    if(!ready())return;
    const t=ctx.currentTime,p=Math.min(1,power/8);
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.frequency.setValueAtTime(190-70*p,t); o.frequency.exponentialRampToValueAtTime(42,t+0.13);
    g.gain.setValueAtTime(0.18+0.42*p,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
    o.connect(g).connect(sfxBus); o.start(t); o.stop(t+0.22);
    const s=ctx.createBufferSource(); s.buffer=noise; s.playbackRate.value=1.2;
    const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=850+1900*p; f.Q.value=1.1;
    const ng=ctx.createGain(); ng.gain.setValueAtTime(0.12+0.3*p,t);
    ng.gain.exponentialRampToValueAtTime(0.001,t+0.11);
    s.connect(f).connect(ng).connect(sfxBus); s.start(t); s.stop(t+0.13);
    if(p>0.55)roar(p*0.5,1.1);
  }
  function dash(){
    if(!ready())return;
    const t=ctx.currentTime;
    const s=ctx.createBufferSource(); s.buffer=noise; s.playbackRate.value=1.4;
    const f=ctx.createBiquadFilter(); f.type='bandpass'; f.Q.value=2.2;
    f.frequency.setValueAtTime(420,t); f.frequency.exponentialRampToValueAtTime(3000,t+0.22);
    const g=ctx.createGain(); g.gain.setValueAtTime(0.16,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.24);
    s.connect(f).connect(g).connect(sfxBus); s.start(t); s.stop(t+0.26);
  }
  function siren(){
    if(!ready())return;
    const t=ctx.currentTime;
    const o=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();
    o.type='sawtooth'; lp.type='lowpass'; lp.frequency.value=1700;
    o.frequency.setValueAtTime(430,t);
    for(let i=0;i<3;i++){
      o.frequency.exponentialRampToValueAtTime(880,t+0.3+i*0.6);
      o.frequency.exponentialRampToValueAtTime(430,t+0.6+i*0.6);
    }
    g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(0.17,t+0.1);
    g.gain.setValueAtTime(0.17,t+1.5); g.gain.exponentialRampToValueAtTime(0.001,t+1.9);
    o.connect(lp).connect(g).connect(sfxBus); o.start(t); o.stop(t+2);
    roar(0.5,2);
  }
  function goalHorn(){
    if(!ready())return;
    const t=ctx.currentTime;
    for(const f of [233.08,293.66,349.23,466.16]){
      const o=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();
      o.type='sawtooth'; o.frequency.value=f;
      lp.type='lowpass'; lp.frequency.value=2400;
      g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.13,t+0.06);
      g.gain.setValueAtTime(0.13,t+0.95); g.gain.exponentialRampToValueAtTime(0.0001,t+1.6);
      o.connect(lp).connect(g).connect(sfxBus); o.start(t); o.stop(t+1.65);
    }
    roar(1,2.6);
  }
  function fanfare(){
    if(!ready())return;
    const t0=ctx.currentTime;
    [[0,392],[0.16,523.25],[0.32,659.25],[0.48,783.99],[0.7,1046.5]].forEach(([d,f])=>{
      const t=t0+d;
      const o=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();
      o.type='sawtooth'; o.frequency.value=f;
      lp.type='lowpass'; lp.frequency.value=3200;
      g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.15,t+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,t+(d>0.6?1.4:0.34));
      o.connect(lp).connect(g).connect(sfxBus); o.start(t); o.stop(t+1.5);
    });
    roar(1,3);
  }

  /* ---- commentary ---- */
  let lastSpoke=0,voice=null;
  function pickVoice(){
    if(!('speechSynthesis'in window))return null;
    const all=speechSynthesis.getVoices();
    if(!all.length)return null;
    return all.find(v=>/en-GB/i.test(v.lang))||all.find(v=>/^en/i.test(v.lang))||all[0];
  }
  if('speechSynthesis'in window){
    voice=pickVoice();
    speechSynthesis.addEventListener('voiceschanged',()=>{voice=pickVoice()});
  }
  function duck(d){
    if(!ctx||ducked===d)return;
    ducked=d;
    const t=ctx.currentTime;
    musicBus.gain.setTargetAtTime(d?0.12:0.34,t,0.12);
    crowdBus.gain.setTargetAtTime(d?0.28:0.7,t,0.12);
  }
  /* priority 0 = colour commentary (dropped if the commentator is mid-sentence),
     2 = a goal or the final, which cuts straight in. */
  function speak(text,priority){
    if(!voiceOn||!('speechSynthesis'in window))return;
    const now=performance.now();
    if(priority>=2)speechSynthesis.cancel();
    else{
      if(speechSynthesis.speaking||speechSynthesis.pending)return;
      if(now-lastSpoke<2600)return;
    }
    lastSpoke=now;
    const u=new SpeechSynthesisUtterance(text);
    if(voice)u.voice=voice;
    u.rate=1.12; u.pitch=1.02; u.volume=1;
    u.onstart=()=>duck(true);
    u.onend=u.onerror=()=>duck(false);
    try{speechSynthesis.speak(u)}catch(e){}
  }

  function setOn(v){
    on=v;
    try{localStorage.setItem('wcf.sfx',v?'1':'0')}catch(e){}
    if(!ctx){if(v)init();else return}
    master.gain.setTargetAtTime(v?0.9:0,ctx.currentTime,0.05);
    if(!v)stopMusic();
  }
  function setVoiceOn(v){
    voiceOn=v;
    try{localStorage.setItem('wcf.voice',v?'1':'0')}catch(e){}
    if(!v&&'speechSynthesis'in window){speechSynthesis.cancel();duck(false)}
  }
  function shutUp(){ if('speechSynthesis'in window){speechSynthesis.cancel();duck(false)} }

  // read-only view of the live mix, for tuning and for tests
  const levels=()=>ctx?{master:+master.gain.value.toFixed(4),music:+musicBus.gain.value.toFixed(4),
    crowdBus:+crowdBus.gain.value.toFixed(4),crowd:+crowdGain.gain.value.toFixed(4),
    sfx:+sfxBus.gain.value.toFixed(4),crowdBase:+crowdBase.toFixed(4),
    intensity:+intensity.toFixed(2),running,state:ctx.state}:null;

  return {init,resume,startMusic,stopMusic,setIntensity,setCrowd,roar,
          whistle,hit,dash,siren,goalHorn,fanfare,speak,shutUp,
          setOn,setVoiceOn,isOn:()=>on,isVoiceOn:()=>voiceOn,levels};
})();

const pick=list=>list[Math.floor(Math.random()*list.length)];

/* ---- wiring ---- */
$('start').onclick=startCup;
$('again').onclick=()=>{showScreen('scrMenu');renderFlagGrid($('search').value)};
$('newCup').onclick=()=>{
  if(pendingAdvance){clearTimeout(pendingAdvance);pendingAdvance=null}
  playing=false;auto=false;match=null;
  AudioFX.stopMusic();AudioFX.shutUp();
  showScreen('scrMenu');
};
$('fight').onclick=()=>{
  if(!match)return;
  if(match.over){
    if(pendingAdvance){clearTimeout(pendingAdvance);pendingAdvance=null}
    nextMatch(); return;
  }
  if(playing){playing=false;AudioFX.stopMusic();AudioFX.shutUp();$('fight').textContent='▶ RESUME';syncControls()}
  else beginFight();
};
$('slam').onclick=()=>{slamQueued=true};
$('auto').onclick=()=>{
  auto=!auto;
  if(auto&&match&&!match.over&&!playing)beginFight();
  syncControls();
};
$('modeToggle').onclick=()=>{
  setMode(mode==='play'?'watch':'play');
  if(match&&!match.started){
    const t=humanTeamFor(match.a.flag,match.b.flag);
    match.a.human=t===0; match.b.human=t===1;
    hudCache=''; refreshHud();
  }
};
$('simRest').onclick=simRest;
$('speed').oninput=e=>{speed=+e.target.value;$('speedV').textContent=speed.toFixed(1)+'×'};
$('impact').oninput=e=>{impactSetting=+e.target.value;$('impactV').textContent=impactSetting+'%'};
$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();

function paintAudioBtns(){
  $('sfxBtn').textContent=AudioFX.isOn()?'🔊':'🔇';
  $('sfxBtn').setAttribute('aria-pressed',AudioFX.isOn());
  $('voiceBtn').textContent=AudioFX.isVoiceOn()?'🎙':'🚫';
  $('voiceBtn').setAttribute('aria-pressed',AudioFX.isVoiceOn());
}
$('sfxBtn').onclick=()=>{
  AudioFX.setOn(!AudioFX.isOn());
  if(AudioFX.isOn()&&playing)AudioFX.startMusic();
  paintAudioBtns();
};
$('voiceBtn').onclick=()=>{AudioFX.setVoiceOn(!AudioFX.isVoiceOn());paintAudioBtns()};
paintAudioBtns();
// browsers refuse to start audio before a gesture, so unlock on the first interaction
addEventListener('pointerdown',()=>{AudioFX.init();AudioFX.resume()},{once:true});

myFlag=FLAGS[Math.floor(Math.random()*FLAGS.length)];
$('pickedName').textContent=myFlag[0];
renderFlagGrid('');
setMode('play');
</script>
</body>
