<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>World Cup of Flags — Flag Clash</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#02060b;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{display:flex;justify-content:center}.app{width:min(100%,560px);min-height:100vh;padding:8px;background:radial-gradient(circle at 50% 0,#18365a,#07111a 42%,#02060b 85%)}
.top{display:flex;justify-content:space-between;align-items:center}.live{font-size:8px;font-weight:1000;letter-spacing:1.5px;color:#ff647d}.live i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff405f;margin-right:5px;box-shadow:0 0 12px #ff405f}.btn{border:1px solid #29415d;background:#0d1a2a;color:#fff;border-radius:9px;padding:8px 10px;font-size:8px;font-weight:1000}.primary{background:linear-gradient(135deg,#386cff,#a148ff);border:0}.title{text-align:center;font-size:25px;font-weight:1000;line-height:.88;margin:6px 0 2px}.sub{text-align:center;color:#8798b5;font-size:8px;margin-bottom:7px}.panel{background:#0b1726;border:1px solid #203651;border-radius:10px;padding:7px;margin-top:6px}.row{display:flex;justify-content:space-between;font-size:8px;font-weight:1000}.muted{color:#7286a3}.bar{height:4px;background:#192a40;border-radius:9px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#35d7ff,#8c5cff)}
.arenaBox{position:relative;margin-top:7px;border:2px solid #38506a;border-radius:13px;overflow:hidden;background:#081d31;box-shadow:0 15px 40px #0009}.arena{display:block;width:100%;height:auto;aspect-ratio:9/13}.badge{position:absolute;top:7px;left:50%;transform:translateX(-50%);padding:5px 9px;border-radius:99px;background:#06100add;border:1px solid #ffffff33;font-size:7px;font-weight:1000;white-space:nowrap}.scorebar{position:absolute;left:7px;right:7px;bottom:7px;display:flex;gap:6px}.score{flex:1;background:#06100acc;border:1px solid #ffffff33;border-radius:8px;padding:5px;text-align:center;font-size:7px;font-weight:1000}.announce{text-align:center;min-height:29px;padding:7px 2px;font-size:9px;font-weight:1000}.announce strong{color:#6ee8ff}.controls{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:5px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:5px}.setting{background:#0b1726;border:1px solid #203651;border-radius:9px;padding:6px}.setting label{display:flex;justify-content:space-between;color:#899ab7;font-size:7px;font-weight:900}.setting input{width:100%;accent-color:#647cff}.rounds{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:5px}.round{padding:5px 1px;background:#122139;border-radius:6px;text-align:center;color:#687c9b;font-size:6px;font-weight:1000}.round.active{background:#304a7c;color:#fff}.feed{max-height:90px;overflow:auto}.event{padding:4px 0;border-bottom:1px solid #17263b;color:#8797b2;font-size:7px}.champ{display:none;text-align:center;margin-top:7px;padding:15px;background:radial-gradient(circle at 50% 0,#60491b,#1b1820 60%);border:1px solid #b38c3d;border-radius:13px}.champ.show{display:block}.champ h2{font-size:20px;margin:3px}.cup{font-size:38px}@keyframeshit{50%{filter:brightness(1.9)}}.hit{animation:hit .2s 4}
</style>
</head>
<body><main class="app">
<div class="top"><div class="live"><i></i>LIVE FLAG CLASH</div><button class="btn" id="fs">⛶</button></div>
<div class="title">WORLD CUP<br>OF FLAGS</div><div class="sub">Autonomous flag-vs-flag arena • Knockout = elimination</div>
<section class="panel"><div class="row"><span id="round">ROUND OF 64</span><span id="match">32 BATTLES</span></div><div class="bar"><i id="progress"></i></div></section>
<div class="arenaBox" id="box"><canvas id="arena" class="arena"></canvas><div class="badge">⚡ AUTONOMOUS FLAG PHYSICS</div><div class="scorebar"><div class="score" id="topName">—</div><div class="score" id="bottomName">—</div></div></div>
<div class="announce" id="announce">Ready for battle</div>
<div class="controls"><button class="btn primary" id="kick">⚡ FIGHT</button><button class="btn" id="auto">▶ AUTO</button><button class="btn" id="new">↻ NEW CUP</button></div>
<div class="settings"><div class="setting"><label>SPEED <b id="speedV">1.0×</b></label><input id="speed" type="range" min=".5" max="2" step=".1" value="1"></div><div class="setting"><label>IMPACT <b id="impactV">60%</b></label><input id="impact" type="range" min="20" max="100" value="60"></div></div>
<section class="panel"><div class="row"><span>TOURNAMENT</span><span class="muted" id="teams">64 FLAGS</span></div><div class="rounds" id="rounds"></div></section>
<section class="panel"><div class="row"><span>COMMENTARY</span><span class="muted">LIVE</span></div><div class="feed" id="feed"></div></section>
<section class="champ" id="champ"><div class="cup">🏆</div><h2 id="champion">—</h2><div style="font-size:7px;color:#c6b98e">WORLD CUP OF FLAGS CHAMPION</div><button class="btn primary" id="again" style="margin-top:8px;width:100%">PLAY AGAIN</button></section>
</main>
<script>
const N=[['Argentina','ar'],['Australia','au'],['Austria','at'],['Belgium','be'],['Brazil','br'],['Bulgaria','bg'],['Cameroon','cm'],['Canada','ca'],['Chile','cl'],['China','cn'],['Colombia','co'],['Croatia','hr'],['Czechia','cz'],['Denmark','dk'],['Ecuador','ec'],['Egypt','eg'],['England','gb'],['Finland','fi'],['France','fr'],['Germany','de'],['Ghana','gh'],['Greece','gr'],['Hungary','hu'],['Iceland','is'],['India','in'],['Indonesia','id'],['Iran','ir'],['Ireland','ie'],['Italy','it'],['Jamaica','jm'],['Japan','jp'],['Kenya','ke'],['Mexico','mx'],['Morocco','ma'],['Netherlands','nl'],['New Zealand','nz'],['Nigeria','ng'],['Norway','no'],['Panama','pa'],['Paraguay','py'],['Peru','pe'],['Poland','pl'],['Portugal','pt'],['Qatar','qa'],['Romania','ro'],['Russia','ru'],['Saudi Arabia','sa'],['Senegal','sn'],['Serbia','rs'],['Singapore','sg'],['Slovakia','sk'],['Slovenia','si'],['South Africa','za'],['South Korea','kr'],['Spain','es'],['Sweden','se'],['Switzerland','ch'],['Tunisia','tn'],['Turkey','tr'],['Ukraine','ua'],['United States','us'],['Uruguay','uy'],['Vietnam','vn']];
const R=['ROUND OF 64','ROUND OF 32','ROUND OF 16','QUARTERFINALS','SEMIFINALS','GRAND FINAL'];
const $=id=>document.getElementById(id),cv=$('arena'),ctx=cv.getContext('2d'),W=540,H=780,BOUND=34,RADIUS=34,END=110;
let queue=[],winners=[],a=null,b=null,playing=false,auto=false,round=0,speed=1,impact=60,last=0,acc=0,matchTime=0,events=[],images={},lock=false;
function resize(){const d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function shuffle(x){return[...x].sort(()=>Math.random()-.5)}
function log(s){events.unshift(s);$('feed').innerHTML=events.slice(0,24).map(x=>`<div class="event">${x}</div>`).join('')}
function flag(t){if(!images[t[1]]){const im=new Image();im.src=`https://flagcdn.com/w160/${t[1]}.png`;images[t[1]]=im}return images[t[1]]}
function clamp(v,l,h){return Math.max(l,Math.min(h,v))}
function norm(x,y){const d=Math.hypot(x,y)||1;return[x/d,y/d]}
function make(t,team){return{t,team,x:W/2,y:team?H*.78:H*.22,vx:0,vy:team?-1:1,r:RADIUS,mass:1,energy:1,skill:.85+Math.random()*.3,attack:.8+Math.random()*.4,stun:0,hitCd:0,charge:0}}
function update(){const n=queue.length+winners.length+(a&&b?2:0);$('round').textContent=R[Math.min(round,5)];$('match').textContent=n>1?Math.ceil(n/2)+' BATTLES':'COMPLETE';$('teams').textContent=n+' '+(n===1?'FLAG':'FLAGS');$('progress').style.width=Math.max(0,Math.min(100,(64-n)/63*100))+'%';$('rounds').innerHTML=R.map((x,i)=>`<div class="round ${i===round?'active':''}>${x.replace('ROUND OF ','R').replace('QUARTERFINALS','QF').replace('SEMIFINALS','SF').replace('GRAND FINAL','FINAL')}</div>`).join('');if(a&&b){$('topName').textContent='🔵 '+a.t[0];$('bottomName').textContent='🔴 '+b.t[0]}}
function setup(){if(queue.length<2){if(winners.length===1){champ(winners[0]);return}if(winners.length){queue=winners;winners=[];round++}else return}a=make(queue.shift(),0);b=make(queue.shift(),1);matchTime=0;lock=false;update();$('announce').innerHTML=`⚔️ <strong>${a.t[0]}</strong> vs <strong>${b.t[0]}</strong> — READY`;$('kick').textContent='⚡ FIGHT'}
function fight(){if(!a||!b)return;playing=true;$('kick').textContent='⏸ PAUSE';$('announce').innerHTML=`⚡ FIGHT! <strong>${a.t[0]}</strong> vs <strong>${b.t[0]}</strong>`;log(`⚔️ ${a.t[0]} vs ${b.t[0]} — clash begins`)}
function steer(p,o){if(p.stun>0)return;const dx=o.x-p.x,dy=o.y-p.y,[nx,ny]=norm(dx,dy);const dist=Math.hypot(dx,dy);let desire=dist>RADIUS*1.8?1:.35;if(p.charge>0)desire=1.45;p.vx+=nx*.13*p.skill*desire;p.vy+=ny*.13*p.skill*desire;p.vx*=.965;p.vy*=.965;const max=p.charge>0?6.6:4.2;const v=Math.hypot(p.vx,p.vy);if(v>max){p.vx=p.vx/v*max;p.vy=p.vy/v*max}p.x+=p.vx;p.y+=p.vy;p.x=clamp(p.x,BOUND+p.r,W-BOUND-p.r);p.y=clamp(p.y,BOUND+p.r,H-BOUND-p.r);if(dist<170&&p.energy>.55&&Math.random()<.008){p.charge=.38;p.energy-=.22}}
function physics(){if(!playing||!a||!b)return;matchTime+=1/60;for(const p of[a,b]){p.stun=Math.max(0,p.stun-1/60);p.hitCd=Math.max(0,p.hitCd-1/60);p.charge=Math.max(0,p.charge-1/60);p.energy=Math.min(1,p.energy+.002)}steer(a,b);steer(b,a);const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,min=a.r+b.r;if(d<min){const nx=dx/d,ny=dy/d,over=min-d;a.x-=nx*over*.52;a.y-=ny*over*.52;b.x+=nx*over*.52;b.y+=ny*over*.52;const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;let impactPower=Math.abs(rel)+((a.charge>0||b.charge>0)?2.8:0);if(rel<0||a.charge>0||b.charge>0){const impulse=Math.max(1.2,impactPower)*(impact/60);a.vx-=nx*impulse;a.vy-=ny*impulse;b.vx+=nx*impulse;b.vy+=ny*impulse}if(a.hitCd<=0&&b.hitCd<=0&&impactPower>3.0){const winner=(impactPower+(Math.random()-.5)*1.6+(a.skill-b.skill))>3.1?a:b;const loser=winner===a?b:a;loser.stun=.16+Math.random()*.22;loser.vx*=.42;loser.vy*=.42;winner.energy=Math.max(0,winner.energy-.08);winner.hitCd=.2;loser.hitCd=.2;$('announce').innerHTML=`💥 <strong>${winner.t[0]}</strong> smashes ${loser.t[0]}!`;log(`💥 ${winner.t[0]} lands a heavy hit`)}}
// Arena edges are elimination zones: getting knocked beyond an end line loses.
const inSide=(p)=>p.x<BOUND+p.r||p.x>W-BOUND-p.r;const topOut=a.y<BOUND-6,bottomOut=b.y>H-BOUND+6;if(topOut||bottomOut){score(topOut?b:a);return}
// Side-wall ricochet keeps the fight inside the arena.
for(const p of[a,b]){if(p.x<=BOUND+p.r||p.x>=W-BOUND-p.r){p.vx*=-.72;p.x=clamp(p.x,BOUND+p.r,W-BOUND-p.r)}}
if(matchTime>28&&!lock){const winner=(a.energy+b.energy)>0.8?(Math.hypot(a.vx,a.vy)+a.attack+Math.random())>(Math.hypot(b.vx,b.vy)+b.attack+Math.random())?a:b:(a.energy>b.energy?a:b);const loser=winner===a?b:a;loser.y=loser===a?BOUND-10:H-BOUND+10;loser.vy=loser===a?-5:5;log(`🔥 ${winner.t[0]} forces the final push`)}
}
function score(w){if(lock||!playing)return;lock=true;playing=false;const loser=w===a?b:a;winners.push(w.t);$('box').classList.add('hit');$('announce').innerHTML=`💥 <strong>${loser.t[0]}</strong> knocked out! — <strong>${w.t[0]}</strong> ADVANCES`;log(`🏆 ${w.t[0]} eliminates ${loser.t[0]}`);$('kick').textContent='⚡ NEXT';setTimeout(()=>{$('box').classList.remove('hit');a=b=null;setup()},700/speed)}
function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#082b43');g.addColorStop(1,'#071522');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#4bdcff55';ctx.lineWidth=3;ctx.strokeRect(BOUND,BOUND,W-BOUND*2,H-BOUND*2);ctx.setLineDash([8,10]);ctx.strokeStyle='#ffffff25';ctx.beginPath();ctx.moveTo(BOUND,H/2);ctx.lineTo(W-BOUND,H/2);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#ffffff40';ctx.lineWidth=2;ctx.beginPath();ctx.arc(W/2,H/2,78,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ffffff12';ctx.beginPath();ctx.arc(W/2,H/2,55,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff365544';ctx.fillRect(BOUND,BOUND,W-BOUND*2,END);ctx.fillStyle='#35d7ff33';ctx.fillRect(BOUND,H-BOUND-END,W-BOUND*2,END);for(const p of[a,b]){if(!p)continue;ctx.save();ctx.translate(p.x,p.y);ctx.shadowColor=p.team?'#ff405f':'#36d9ff';ctx.shadowBlur=20;ctx.fillStyle=p.team?'#ff405f':'#36d9ff';ctx.beginPath();ctx.arc(0,0,p.r+5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.clip();const im=flag(p.t);if(im.complete&&im.naturalWidth)ctx.drawImage(im,-p.r,-p.r,p.r*2,p.r*2);else{ctx.fillStyle='#fff';ctx.fillRect(-p.r,-p.r,p.r*2,p.r*2)}ctx.restore();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,p.r+4,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.font='900 10px system-ui';ctx.textAlign='center';ctx.fillText(p.t[0],p.x,p.y+p.r+20);if(p.charge>0){ctx.strokeStyle='#ffd84a';ctx.lineWidth=5;ctx.beginPath();ctx.arc(p.x,p.y,p.r+11,0,Math.PI*2);ctx.stroke()}}}
function loop(t){if(!last)last=t;const dt=Math.min(.05,(t-last)/1000)*speed;last=t;acc+=dt;while(acc>=1/60){physics();acc-=1/60}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function champ(c){playing=false;a=b=null;$('round').textContent='CHAMPION';$('match').textContent='COMPLETE';$('teams').textContent='1 CHAMPION';$('progress').style.width='100%';$('champion').textContent=c[0];$('champ').classList.add('show');$('announce').innerHTML=`🏆 <strong>${c[0]}</strong> IS CHAMPION!`;log(`👑 ${c[0]} won the World Cup of Flags`)}
function newCup(){playing=false;round=0;queue=shuffle(N).slice(0,64);winners=[];a=b=null;events=[];$('feed').innerHTML='';$('champ').classList.remove('show');setup()}
$('kick').onclick=()=>playing?(playing=false,$('kick').textContent='⚡ RESUME'):fight();$('new').onclick=newCup;$('again').onclick=newCup;$('auto').onclick=()=>{auto=!auto;$('auto').textContent=auto?'⏸ AUTO':'▶ AUTO';if(auto&&!playing)fight()};$('speed').oninput=e=>{speed=+e.target.value;$('speedV').textContent=speed.toFixed(1)+'×'};$('impact').oninput=e=>{impact=+e.target.value;$('impactV').textContent=impact+'%'};$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();newCup();
</script></body></html>
