<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>World Cup of Flags — Football Physics</title><style>
*{box-sizing:border-box}body{margin:0;background:#03070d;color:#fff;font-family:Inter,system-ui,sans-serif;display:flex;justify-content:center}.app{width:min(100%,560px);min-height:100vh;padding:10px 10px 24px;background:radial-gradient(circle at 50% 0,#17345b,#07111f 35%,#03070d 75%)}header{text-align:center}.live{font-size:9px;font-weight:900;letter-spacing:2px;color:#ff6d7f}.live:before{content:'●';margin-right:5px}.title{font-size:29px;font-weight:1000;line-height:.95;margin:5px}.sub{font-size:10px;color:#8998b7;margin:7px 0}.modes{display:flex;gap:5px;overflow:auto;margin:9px 0}.mode,.btn{border:1px solid #263a5d;background:#101b2d;color:#cbd6ee;border-radius:10px;padding:9px 10px;font-size:9px;font-weight:900;white-space:nowrap}.mode.active,.btn.primary{background:linear-gradient(135deg,#346cff,#9d43ff);color:#fff;border-color:transparent}.status{background:#0b1627;border:1px solid #203452;border-radius:13px;padding:9px}.statusrow{display:flex;justify-content:space-between;font-size:10px;font-weight:900}.muted{color:#7183a5}.bar{height:5px;background:#182842;border-radius:99px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38d6ff,#8f55ff);transition:.3s}.arenaWrap{position:relative;margin-top:9px;border:2px solid #25415b;border-radius:17px;overflow:hidden;box-shadow:0 20px 50px #0008;background:#075d2a}.arenaWrap:after{content:'⚽ AUTOMATED PHYSICS';position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:1000;letter-spacing:1.2px;background:#04100a99;padding:5px 8px;border-radius:99px;z-index:3}.arena{display:block;width:100%;aspect-ratio:9/12;background:#087334}.announce{min-height:32px;text-align:center;padding:8px 3px;font-size:11px;font-weight:950}.announce strong{color:#7ee8ff}.controls{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.setting{background:#0b1627;border:1px solid #1e304b;border-radius:10px;padding:7px}.setting label{display:flex;justify-content:space-between;font-size:8px;color:#8fa0bf;font-weight:900}.setting input{width:100%;accent-color:#587dff}.section{margin-top:8px;background:#0b1627;border:1px solid #1d304b;border-radius:13px;padding:9px}.head{display:flex;justify-content:space-between;font-size:9px;font-weight:900;color:#9daccc;margin-bottom:7px}.rounds{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.r{padding:6px 2px;text-align:center;background:#111f33;border-radius:7px;font-size:7px;color:#667996;font-weight:900}.r.active{background:#293f70;color:#fff}.feed{max-height:120px;overflow:auto}.event{padding:5px 0;border-bottom:1px solid #15243a;font-size:8px;color:#8393b1}.champ{display:none;text-align:center;padding:18px 8px;background:radial-gradient(circle at 50% 0,#5b4718,#1b1820 55%,#0b1019);border:1px solid #a58236;border-radius:16px;margin-top:8px}.champ.show{display:block}.cup{font-size:46px}.champ h2{margin:4px 0;font-size:23px}.champ p{font-size:8px;color:#aaa}.footer{text-align:center;font-size:7px;color:#4f607d;margin-top:10px}@keyframes goal{50%{filter:brightness(1.8) saturate(1.5)}}.goal{animation:goal .6s 3}
</style></head><body><main class="app"><header><div class="live">LIVE AUTOMATED TOURNAMENT</div><div class="title">WORLD CUP<br>OF FLAGS</div><div class="sub">Football physics decides who survives.</div></header><div class="modes"><button class="mode active" data-mode="balanced">🏆 BALANCED</button><button class="mode" data-mode="chaos">🔥 CHAOS</button><button class="mode" data-mode="kenya">🇰🇪 KENYA DYNASTY</button></div><section class="status"><div class="statusrow"><span id="round">ROUND OF 64</span><span id="count">32 MATCHES</span></div><div class="bar"><i id="progress"></i></div></section><div class="arenaWrap" id="wrap"><canvas id="arena" class="arena"></canvas></div><div class="announce" id="announce">Kickoff loading…</div><div class="controls"><button class="btn primary" id="start">⚽ KICKOFF</button><button class="btn" id="auto">▶ AUTO CUP</button><button class="btn" id="new">↻ NEW CUP</button></div><div class="settings"><div class="setting"><label>Match speed <b id="speedv">1.0×</b></label><input id="speed" type="range" min=".5" max="2" step=".1" value="1"></div><div class="setting"><label>Physics chaos <b id="chaosv">55%</b></label><input id="chaos" type="range" min="0" max="100" value="55"></div></div><section class="section"><div class="head"><span>TOURNAMENT BRACKET</span><span id="remaining">64 TEAMS</span></div><div class="rounds" id="rounds"></div></section><section class="section"><div class="head"><span>LIVE COMMENTARY</span><span>● LIVE</span></div><div class="feed" id="feed"></div></section><section class="champ" id="champ"><div class="cup">🏆</div><h2 id="champName">—</h2><p>WORLD CUP OF FLAGS CHAMPION</p><button class="btn primary" id="again">PLAY ANOTHER CUP</button></section><div class="footer">Automated 2D physics • Flag footballers • Goal = elimination</div></main><script>
const N=[['Argentina','ar'],['Australia','au'],['Austria','at'],['Belgium','be'],['Brazil','br'],['Bulgaria','bg'],['Cameroon','cm'],['Canada','ca'],['Chile','cl'],['China','cn'],['Colombia','co'],['Croatia','hr'],['Czechia','cz'],['Denmark','dk'],['Ecuador','ec'],['Egypt','eg'],['England','gb'],['Finland','fi'],['France','fr'],['Georgia','ge'],['Germany','de'],['Ghana','gh'],['Greece','gr'],['Hungary','hu'],['Iceland','is'],['India','in'],['Indonesia','id'],['Iran','ir'],['Ireland','ie'],['Italy','it'],['Jamaica','jm'],['Japan','jp'],['Kenya','ke'],['Mexico','mx'],['Morocco','ma'],['Netherlands','nl'],['New Zealand','nz'],['Nigeria','ng'],['Norway','no'],['Panama','pa'],['Paraguay','py'],['Peru','pe'],['Poland','pl'],['Portugal','pt'],['Qatar','qa'],['Romania','ro'],['Russia','ru'],['Saudi Arabia','sa'],['Scotland','gb'],['Senegal','sn'],['Serbia','rs'],['Singapore','sg'],['Slovakia','sk'],['Slovenia','si'],['South Africa','za'],['South Korea','kr'],['Spain','es'],['Sweden','se'],['Switzerland','ch'],['Tunisia','tn'],['Turkey','tr'],['Ukraine','ua'],['United States','us'],['Uruguay','uy'],['Vietnam','vn']];
const R=['R64','R32','R16','QF','SF','FINAL'];const $=x=>document.getElementById(x),img=c=>`https://flagcdn.com/w160/${c}.png`;const canvas=$('arena'),ctx=canvas.getContext('2d');let W=540,H=720,teams=[],a,b,ball,playing=false,auto=false,timer=0,speed=1,chaos=55,mode='balanced',round=0,matches=0,history=[],raf,score=0,assets={};
function fit(){let r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;W=540;H=720;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',fit);fit();
function shuffle(x){return [...x].sort(()=>Math.random()-.5)}function say(t){$('announce').innerHTML=t}function log(t){history.unshift(t);$('feed').innerHTML=history.slice(0,28).map(x=>`<div class="event">${x}</div>`).join('')}
function roundsUI(){let ri=round;$('rounds').innerHTML=R.map((x,i)=>`<div class="r ${i===ri?'active':''}">${x}</div>`).join('')}
function loadImage(t){if(!assets[t[1]]){let im=new Image();im.crossOrigin='anonymous';im.src=img(t[1]);assets[t[1]]=im}return assets[t[1]]}
function player(t,x,team){return {t,x,y:H/2, vx:0,vy:0,r:25,team,energy:.8+Math.random()*.4,angle:0}}
function kickoff(){let left=player(a,95,0),right=player(b,W-95,1);left.y=H/2+(Math.random()-.5)*150;right.y=H/2+(Math.random()-.5)*150;ball={x:W/2,y:H/2,vx:(Math.random()<.5?-1:1)*3,vy:(Math.random()-.5)*2,r:8,owner:null};state=[left,right];playing=true;score=0;say(`⚽ <strong>${a[0]}</strong> vs <strong>${b[0]}</strong> — KICKOFF!`);log(`⚽ Kickoff: <b>${a[0]}</b> vs <b>${b[0]}</b>`);$('start').textContent='⏸ PLAYING'}let state=[];
function chooseTarget(p,other){let gx=p.team?55:W-55;let gy=H/2;if(Math.random()<.15+chaos/300)gy=H/2+(Math.random()-.5)*H*.65;let dx=gx-p.x,dy=gy-p.y,d=Math.hypot(dx,dy)||1;return [dx/d,dy/d]}
function step(dt){if(!playing)return;let p0=state[0],p1=state[1];for(let p of state){let enemy=state[1-p.team],target=chooseTarget(p,enemy);let bx=ball.x-p.x,by=ball.y-p.y,bd=Math.hypot(bx,by)||1;let has=ball.owner===p.team;if(!has&&bd<145){target=[bx/bd,by/bd]}let accel=0.055*p.energy*(.7+chaos/180);p.vx+=target[0]*accel;p.vy+=target[1]*accel;let max=2.3*p.energy;if(has)max*=1.15;p.vx*=.96;p.vy*=.96;let v=Math.hypot(p.vx,p.vy);if(v>max){p.vx=p.vx/v*max;p.vy=p.vy/v*max}p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=Math.max(32,Math.min(W-32,p.x));p.y=Math.max(32,Math.min(H-32,p.y));}
let dx=p1.x-p0.x,dy=p1.y-p0.y,d=Math.hypot(dx,dy)||1;if(d<p0.r+p1.r){let nx=dx/d,ny=dy/d,rel=(p0.vx-p1.vx)*nx+(p0.vy-p1.vy)*ny;p0.vx-=rel*nx*.7;p0.vy-=rel*ny*.7;p1.vx+=rel*nx*.7;p1.vy+=rel*ny*.7;if(ball.owner!==null){let owner=state[ball.owner];if(Math.random()<.25+chaos/250)ball.owner=1-ball.owner} }
if(ball.owner!==null){let p=state[ball.owner];let speed=Math.hypot(p.vx,p.vy);ball.x=p.x+(p.team?-1:1)*24;ball.y=p.y;ball.vx=p.vx;ball.vy=p.vy;let goalX=p.team?W:0;let dist=Math.abs(goalX-ball.x);if(dist<110&&Math.random()<.012*(1+chaos/80)*dt){let dir=p.team?1:-1;ball.owner=null;ball.vx=dir*(6+Math.random()*3);ball.vy=(Math.random()-.5)*4;say(`🔥 <strong>${p.t[0]}</strong> shoots!`);}}
else{ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=.992;ball.vy*=.992;for(let p of state){let d=Math.hypot(ball.x-p.x,ball.y-p.y);if(d<p.r+ball.r+4){if(Math.random()<.7){ball.owner=p.team;ball.vx=ball.vy=0;say(`⚡ <strong>${p.t[0]}</strong> wins possession`)}else{ball.vx=(ball.x-p.x)/d*4;ball.vy=(ball.y-p.y)/d*4}}}}
if(ball.y<20||ball.y>H-20){ball.vy*=-.9;ball.y=Math.max(20,Math.min(H-20,ball.y))}if(ball.x<0||ball.x>W){let winner=ball.x>W?a:b;goal(winner);}}
function goal(winner){if(!playing)return;playing=false;score++;let loser=winner===a?b:a;$('wrap').classList.add('goal');setTimeout(()=>$('wrap').classList.remove('goal'),1700);say(`⚽ <strong>${winner[0]}</strong> SCORES! <span style="color:#ff7184">${loser[0]} ELIMINATED</span>`);log(`🥅 GOAL! <b>${winner[0]}</b> eliminated <b>${loser[0]}</b>`);teams.push(winner);matches++;$('start').textContent='⚽ NEXT';update();setTimeout(nextBattle,Math.max(700,1100/speed));}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#087334';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff88';ctx.lineWidth=3;ctx.strokeRect(15,15,W-30,H-30);ctx.beginPath();ctx.moveTo(W/2,15);ctx.lineTo(W/2,H-15);ctx.stroke();ctx.beginPath();ctx.arc(W/2,H/2,62,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.globalAlpha=.12;ctx.fillRect(0,H/2-1,W,2);ctx.globalAlpha=1;ctx.strokeRect(15,H/2-105,48,210);ctx.strokeRect(W-63,H/2-105,48,210);ctx.fillStyle='#fff';ctx.fillRect(0,H/2-70,12,140);ctx.fillRect(W-12,H/2-70,12,140);if(state.length){for(let p of state)drawPlayer(p)}if(ball){ctx.fillStyle='#fff';ctx.shadowBlur=12;ctx.shadowColor='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#111';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('⚽',ball.x,ball.y+4)}}
function drawPlayer(p){ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,26,24,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#152238';ctx.beginPath();ctx.arc(0,0,27,0,Math.PI*2);ctx.fill();ctx.clip();let im=loadImage(p.t);if(im.complete&&im.naturalWidth)ctx.drawImage(im,-28,-28,56,56);else{ctx.fillStyle='#fff';ctx.fillRect(-28,-28,56,56)}ctx.restore();ctx.strokeStyle=p.team?'#ffda65':'#62e5ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,29,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.font='900 9px system-ui';ctx.textAlign='center';ctx.fillText(p.t[0],p.x,p.y+42)}
function loop(t){if(!timer)timer=t;let dt=Math.min(2,(t-timer)/16.67)*speed;timer=t;if(playing)step(dt);draw();raf=requestAnimationFrame(loop)}requestAnimationFrame(loop);
function update(){let rem=teams.length+(a&&b?2:0);let stage=rem>=64?0:rem>=32?1:rem>=16?2:rem>=8?3:rem>=4?4:rem>=2?5:6;$('round').textContent=stage<6?['ROUND OF 64','ROUND OF 32','ROUND OF 16','QUARTERFINALS','SEMIFINALS','GRAND FINAL'][stage]:'CHAMPION';$('count').textContent=stage<6?`${Math.ceil(rem/2)} MATCHES`:'COMPLETE';$('remaining').textContent=`${rem} TEAMS`;$('progress').style.width=`${((64-rem)/63*100)}%`;round=stage;roundsUI()}
function nextBattle(){if(teams.length===1&&(!a||!b)){champion(teams[0]);return}if(!a&&!b){if(pool.length<2){if(teams.length===1){champion(teams[0]);return}pool.push(...teams);teams=[]}a=pool.shift();b=pool.shift();}if(mode==='kenya'&&a&&b&&(a[1]==='ke'||b[1]==='ke')){if(a[1]!=='ke'){[a,b]=[b,a]}}state=[];ball=null;update();kickoff()}
let pool=[];function newCup(){playing=false;teams=[];pool=shuffle(N).slice(0,64);if(mode==='kenya'){pool=pool.filter(x=>x[1]!=='ke').slice(0,63);pool.push(N.find(x=>x[1]==='ke'));pool=shuffle(pool)}a=b=null;history=[];matches=0;$('feed').innerHTML='';$('champ').classList.remove('show');say('Ready — two automated footballers will decide the next survivor.');update();nextBattle()}
function champion(c){playing=false;a=b=null;$('round').textContent='CHAMPION';$('count').textContent='COMPLETE';$('remaining').textContent='1 CHAMPION';$('progress').style.width='100%';$('champName').textContent=c[0];$('champ').classList.add('show');say(`🏆 <strong>${c[0]}</strong> conquered the tournament!`);log(`👑 <b>${c[0]}</b> is WORLD CUP OF FLAGS CHAMPION`)}
$('start').onclick=()=>{if(playing){playing=false;$('start').textContent='⚽ RESUME'}else if(a&&b){kickoff()}else nextBattle()};$('new').onclick=newCup;$('again').onclick=newCup;$('auto').onclick=()=>{auto=!auto;$('auto').textContent=auto?'⏸ AUTO CUP':'▶ AUTO CUP';if(auto&&a&&!playing)kickoff()};$('speed').oninput=e=>{$('speedv').textContent=e.target.value+'×';speed=+e.target.value};$('chaos').oninput=e=>{$('chaosv').textContent=e.target.value+'%';chaos=+e.target.value};document.querySelectorAll('.mode').forEach(x=>x.onclick=()=>{document.querySelectorAll('.mode').forEach(y=>y.classList.remove('active'));x.classList.add('active');mode=x.dataset.mode;newCup()});newCup();
</script></body></html>
